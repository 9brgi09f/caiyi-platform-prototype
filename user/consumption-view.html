;font-size:13px}.ded-row:first-child{border-top:0}.ded-row span{color:#8a98aa}.ded-row b{color:var(--ink);font-size:15px;font-weight:750}.ded-row b.minus{color:#c0392b}.ded-row b.zero{color:#8a98aa}.ded-note{margin:13px 0 0;padding:11px 13px;border:1px solid #f5d9b8;border-radius:10px;background:#fffaf2;color:#8a6a3a;font-size:12px;line-height:1.65}.ded-note.hide{display:none}.ded-row.total{background:#fbfdff}@media(max-width:960px){.overview-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.overview-item:nth-child(4n){border-right:1px solid var(--line)}.overview-item:nth-child(2n){border-right:0}.overview-item:nth-last-child(-n+4){border-bottom:1px solid var(--line)}.overview-item:nth-last-child(-n+2){border-bottom:0}}@media(max-width:750px){.main-content{padding:20px 16px 32px}.page-head{padding:21px}.overview-grid{grid-template-columns:1fr}.overview-item,.overview-item:nth-child(4n),.overview-item:nth-child(2n){min-height:auto;border-right:0;border-bottom:1px solid var(--line)}.overview-item:last-child{border-bottom:0}}

 d="M5 20c.6-3.4 3-5 7-5s6.4 1.6 7 5"/></svg></span><span>账号管理</span></a><a class="sidebar-link" href="role-list.html"><span class="icon"><svg viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 4.5 2.9 7.9 7 10 4.1-2.1 7-5.5 7-10V6l-7-3Z"/><path d="M9 12h6m-3-3v6"/></svg></span><span>岗位管理</span></a></div></aside><main class="main-content"><section class="page-head"><a class="back" id="backLink" href="consumption-list.html">← 返回消费记录</a><h2 id="title">消费详情</h2><p id="pageDescription">本次调用的消费与扣减明细。</p></section><article class="detail"><section class="section"><h3>消费概览</h3><div class="overview-grid"><div class="overview-item"><span class="label">消费单号</span><span class="value strong" id="order">—</span></div><div class="overview-item"><span class="label">消费时间</span><span class="value" id="consumedAt">—</span></div><div class="overview-item"><span class="label">智能体</span><span class="value" id="agentName">—</span></div><div class="overview-item"><span class="label">消费人</span><span class="value" id="memberName">—</span></div><div class="overview-item"><span class="label">调用状态</span><span class="value" id="callStatus">—</span></div><div class="overview-item"><span class="label">计费方式</span><span class="value" id="billing">—</span></div><div class="overview-item"><span class="label">调用渠道</span><span class="value" id="channel">—</span></div><div class="overview-item"><span class="label">开票状态</span><span class="value" id="invoiceStatus">—</span></div></div></section><section class="section"><h3>扣减明细</h3><div class="ded-list"><div class="ded-row total"><span>消费彩豆</span><b class="minus" id="dedBeans">—</b></div><div class="ded-row"><span>对应金额</span><b class="minus" id="dedMoney">—</b></div><div class="ded-row"><span>扣前企业彩豆余额</span><b id="dedBefore">—</b></div><div class="ded-row"><span>扣后企业彩豆余额</span><b id="dedAfter">—</b></div></div><p class="ded-note hide" id="dedNote">调用失败未产生扣费，企业彩豆余额不变。</p></section></article></main><script>var records={

};
var params=new URLSearchParams(location.search),order=params.get('order');if(!records[order])order="USE20260818143621";var record=records[order];
function setText(id,v){document.getElementById(id).textContent=v}
function setHtml(id,v){document.getElementById(id).innerHTML=v}
function invoiceBadge(){var cls=record.invoice==='待开票'?'eligible':record.invoice==='开票中'?'pending':record.invoice==='不可开票'?'none':'done';return '<span class="invoice-status '+cls+'">'+record.invoice+'</span>'}
function callBadge(){return '<span class="call-status '+(record.status==='成功'?'ok':'fail')+'">'+record.status+'</span>'}
setText('order',order);
setText('consumedAt',record.time);
setText('agentName',record.agent);
setText('memberName',record.member+' · '+record.phone);
setHtml('callStatus',callBadge());
setText('billing',record.billing);
setText('channel',record.channel);
setHtml('invoiceStatus',invoiceBadge());
var failed=record.status!=='成功';
var beansEl=document.getElementById('dedBeans'),moneyEl=document.getElementById('dedMoney');
beansEl.className=failed?'zero':'minus';moneyEl.className=failed?'zero':'minus';
setText('dedBeans',(failed?'':'−')+record.total+' 彩豆');
setText('dedMoney',(failed?'¥':'−¥')+record.total);
document.getElementById('dedNote').classList.toggle('hide',!failed);
setText('dedBefore',record.before+' 彩豆');
setText('dedAfter',record.after+' 彩豆');
document.getElementById('title').textContent=record.agent+'消费详情';
document.title=order+' - 消费详情';</script></body></html>
