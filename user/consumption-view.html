<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>消费详情 - 用户端</title><link href="../styles.css" rel="stylesheet"/>
<link href="_bento-lite-skin.css" rel="stylesheet">
<link href="_glass-soft-skin.css" rel="stylesheet"/>
<script src="../app.js"></script>
<link href="bean-plan.css" rel="stylesheet"/>
<script src="bean-plan.js"></script><style>
:root{--ink:#172b4d;--blue:#2563eb;--bg:#f6f8fc;--line:#e1e9f4;--muted:#708199}.main-content{background:var(--bg);padding:28px 32px 44px}.page-head{margin-bottom:18px;padding:24px 27px;border:1px solid #c9dcfb;border-radius:16px;background:linear-gradient(125deg,#fff,#f2f7ff)}.back{display:inline-block;margin-bottom:9px;color:#2563eb;font-size:13px;text-decoration:none}.page-head h2{margin:0;color:var(--ink);font-size:24px}.page-head p{margin:7px 0 0;color:var(--muted);font-size:13px}.detail{border:1px solid var(--line);border-radius:14px;background:#fff}.section{padding:22px 25px;border-top:1px solid var(--line)}.section:first-child{border-top:0}.section h3{margin:0 0 16px;color:var(--ink);font-size:15px}.overview-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:11px;overflow:hidden}.overview-item{min-height:90px;padding:16px 17px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff}.overview-item:nth-child(4n){border-right:0}.overview-item:nth-last-child(-n+4){border-bottom:0}.label{display:block;margin-bottom:7px;color:#8a98aa;font-size:11px}.value{color:#40536b;font-size:13px;line-height:1.55}.value.strong{color:var(--ink);font-weight:700}.value.amount{color:var(--ink);font-size:17px;font-weight:750}.call-status,.invoice-status{display:inline-flex;align-items:center;min-height:25px;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:700}.call-status.ok{background:#ecfdf5;color:#07845b}.call-status.fail{background:#fdecec;color:#c0392b}.invoice-status.eligible{background:#ecfdf5;color:#07845b}.invoice-status.pending{background:#fff7e8;color:#b7791f}.invoice-status.none{background:#f1f5f9;color:#64748b}.invoice-status.done{background:#eef4ff;color:#2563eb}.ded-list{overflow:hidden;border:1px solid var(--line);border-radius:11px}.ded-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:14px 17px;border-top:1px solid var(--line);font-size:13px}.ded-row:first-child{border-top:0}.ded-row span{color:#8a98aa}.ded-row b{color:var(--ink);font-size:15px;font-weight:750}.ded-row b.minus{color:#c0392b}.ded-row b.zero{color:#8a98aa}.ded-note{margin:13px 0 0;padding:11px 13px;border:1px solid #f5d9b8;border-radius:10px;background:#fffaf2;color:#8a6a3a;font-size:12px;line-height:1.65}.ded-note.hide{display:none}.ded-row.total{background:#fbfdff}@media(max-width:960px){.overview-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.overview-item:nth-child(4n){border-right:1px solid var(--line)}.overview-item:nth-child(2n){border-right:0}.overview-item:nth-last-child(-n+4){border-bottom:1px solid var(--line)}.overview-item:nth-last-child(-n+2){border-bottom:0}}@media(max-width:750px){.main-content{padding:20px 16px 32px}.page-head{padding:21px}.overview-grid{grid-template-columns:1fr}.overview-item,.overview-item:nth-child(4n),.overview-item:nth-child(2n){min-height:auto;border-right:0;border-bottom:1px solid var(--line)}.overview-item:last-child{border-bottom:0}}
.src-note{margin-left:6px;color:#7b8aa6;font-size:12px;font-style:normal;font-weight:500}
</style></head><body class="bento-lite"><header class="top-bar user"><div class="top-bar-left"><a class="top-bar-logo" href="../index.html"><img alt="彩翼高科" class="logo-img" src="../logo.dc57457c.png"/></a><span class="top-bar-title">彩翼公共采购智能体协同管理平台</span></div><div class="top-bar-right"><div class="top-bar-user"><div class="top-bar-avatar">张</div><span>示例科技有限公司</span></div></div></header><aside class="sidebar user"><div class="sidebar-section"><a class="sidebar-link" href="index.html"><span class="icon"><svg viewBox="0 0 24 24"><path d="M4 13h6V4H4v9Zm0 7h6v-4H4v4Zm10 0h6v-9h-6v9Zm0-16v4h6V4h-6Z"/></svg></span><span>概览</span></a><a class="sidebar-link" href="agent-list.html"><span class="icon"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 10h8M8 14h5"/></svg></span><span>智能体市场</span></a><a class="sidebar-link" href="recharge-list.html"><span class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18M16 14h2"/></svg></span><span>账户充值</span></a><a class="sidebar-link" href="payment-accounts.html"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-6 9 6v9H3v-9Z"/><path d="M6 10v9m4-9v9m4-9v9m4-9v9M2 19h20"/></svg></span><span>付款账户</span></a><a class="sidebar-link" href="balance.html"><span class="icon"><svg viewBox="0 0 24 24"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H18a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H6.5A2.5 2.5 0 0 1 4 17.5v-10Z"/><path d="M4 8h13M15 14h3"/></svg></span><span>彩豆管理</span></a><a class="sidebar-link active" href="consumption-list.html"><span class="icon"><svg viewBox="0 0 24 24"><path d="M5 20V10m7 10V4m7 16v-7"/></svg></span><span>消费记录</span></a><a class="sidebar-link" href="invoice-list.html"><span class="icon"><svg viewBox="0 0 24 24"><path d="M6 3h9l3 3v15l-3-2-3 2-3-2-3 2V3Z"/><path d="M9 9h6m-6 4h6"/></svg></span><span>发票管理</span></a><a class="sidebar-link" href="member-list.html"><span class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 20c.6-3.4 3-5 7-5s6.4 1.6 7 5"/></svg></span><span>账号管理</span></a><a class="sidebar-link" href="role-list.html"><span class="icon"><svg viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 4.5 2.9 7.9 7 10 4.1-2.1 7-5.5 7-10V6l-7-3Z"/><path d="M9 12h6m-3-3v6"/></svg></span><span>岗位管理</span></a></div></aside><main class="main-content"><section class="page-head"><a class="back" id="backLink" href="consumption-list.html">← 返回消费记录</a><h2 id="title">消费详情</h2></section><article class="detail"><section class="section"><h3>消费概览</h3><div class="overview-grid"><div class="overview-item"><span class="label">消费单号</span><span class="value strong" id="order">—</span></div><div class="overview-item"><span class="label">消费时间</span><span class="value" id="consumedAt">—</span></div><div class="overview-item"><span class="label">智能体</span><span class="value" id="agentName">—</span></div><div class="overview-item"><span class="label">消费人</span><span class="value" id="memberName">—</span></div><div class="overview-item"><span class="label">调用状态</span><span class="value" id="callStatus">—</span></div><div class="overview-item"><span class="label">计费方式</span><span class="value" id="billing">—</span></div><div class="overview-item"><span class="label">调用渠道</span><span class="value" id="channel">—</span></div><div class="overview-item"><span class="label">开票状态</span><span class="value" id="invoiceStatus">—</span></div></div></section><section class="section"><h3>扣减明细</h3><div class="ded-list"><div class="ded-row total"><span>消费彩豆</span><b class="minus" id="dedBeans">—</b></div><div class="ded-row"><span>对应金额</span><b class="minus" id="dedMoney">—</b></div><div class="ded-row"><span id="dedBeforeLabel">扣前单位彩豆余额</span><b id="dedBefore">—</b></div><div class="ded-row"><span id="dedAfterLabel">扣后单位彩豆余额</span><b id="dedAfter">—</b></div></div><p class="ded-note hide" id="dedNote">调用失败未产生扣费，单位彩豆余额不变。</p></section><section class="section" id="srcSection"><h3>扣减来源</h3><div class="ded-list" id="srcList"></div><div id="invBase" hidden></div></section></article></main><script>
(function(){
var B=window.BeanPlan;
var rows=B.consumptions(), order=new URLSearchParams(location.search).get('order');
var r=order?rows.find(function(x){return x.flow.orderNo===order;}):rows[0];
function setText(id,v){document.getElementById(id).textContent=v}
function setHtml(id,v){document.getElementById(id).innerHTML=v}
if(!r){document.querySelector('.detail').innerHTML='<section class="section"><h3>未找到消费记录</h3></section>';return;}
var fl=r.flow, failed=B.isFailed(fl), m=fl.meta;
var INV={eligible:['待开票','eligible'],pending:['开票中','pending'],done:['已开票','done'],none:['不可开票','none']}[m.invoice];
setText('order',fl.orderNo); setText('consumedAt',fl.time); setText('agentName',fl.title);
setText('memberName',fl.who+' · '+(B.PHONE[fl.who]||''));
setHtml('callStatus','<span class="call-status '+(failed?'fail':'ok')+'">'+m.status+'</span>');
setText('billing',m.billing); setText('channel',m.ch);
setHtml('invoiceStatus','<span class="invoice-status '+INV[1]+'">'+INV[0]+'</span>');
var total=failed?0:-r.delta;
document.getElementById('dedBeans').className=failed?'zero':'minus';document.getElementById('dedMoney').className=failed?'zero':'minus';
setText('dedBeans',(failed?'':'−')+B.fmt(total)+' 彩豆'); setText('dedMoney',(failed?'¥':'−¥')+B.fmt(total));
document.getElementById('dedNote').classList.toggle('hide',!failed);
setText('dedBefore',B.fmt(r.before)+' 彩豆'); setText('dedAfter',B.fmt(r.after)+' 彩豆');
setText('dedBeforeLabel','扣前'+B.walletName()+'余额'); setText('dedAfterLabel','扣后'+B.walletName()+'余额');
document.getElementById('title').textContent=fl.title+'消费详情';
document.title=fl.orderNo+' - 消费详情';
// 扣减来源
var src=document.getElementById('srcList'), parts=fl.parts, html='';
['free','plan','recharge'].forEach(function(k){
  if(!parts[k]) return;
  var note=k==='free'?'不开票':k==='plan'||B.invoiceLines(fl).some(function(x){return x.gift;})?'含赠送部分，折算后开票':'计入消费开票金额';
  html+='<div class="ded-row"><span><i class="bp-dot s-'+k+'"></i> '+B.SOURCE_LABEL[k]+(note?' <em class="src-note">'+note+'</em>':'')+'</span><b class="minus">−'+B.fmt(-parts[k])+'</b></div>';
});
if(!html) html='<div class="ded-row"><span>未产生扣减</span><b>—</b></div>';
src.innerHTML=html;
if(!failed){
  var base=B.invoiceBase(fl), box=document.getElementById('invBase');
  var eligible=m.invoice==='eligible';
  var note=base>0?(eligible?'年包彩豆与充值彩豆可开具消费发票，按整笔申请。':INV[0]):
    '这笔消费仅使用免费彩豆，不开票。';
  box.hidden=false;
  box.style.marginTop='14px';
  var bt=B.invoiceLines(fl), gifted=bt.some(function(x){return !x.plain;});
  var lines=gifted?bt.map(function(x){return '<div class="ded-row"><span>'+B.esc(x.label)+' <em class="src-note">'+B.fmt(x.beans)+' 彩豆'+(x.plain?' × 1':' × 未分摊 '+B.money(x.remainPaid)+' ÷ 未使用 '+B.fmt(x.remainBeans)+' 彩豆')+'</em></span><b>'+B.money(x.amount)+'</b></div>';}).join(''):'';
  if(gifted&&eligible) note='按来源年包或充值订单的未分摊实付 ÷ 未使用彩豆折算，赠送部分不开票；批次用完时合计等于实付。按整笔申请。';
  box.innerHTML='<div class="ded-list">'+lines+'<div class="ded-row total"><span>'+(m.invoice==='pending'||m.invoice==='done'?'开票金额':'可开票金额')+'</span><b>'+B.money(eligible||m.invoice==='pending'||m.invoice==='done'?base:0)+'</b></div></div>'+
    '<p class="ded-note">'+note+'</p>';
}
if(failed) document.getElementById('srcSection').style.display='none';
})();
</script></body></html>
