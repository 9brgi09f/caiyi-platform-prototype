 d="M5 20c.6-3.4 3-5 7-5s6.4 1.6 7 5"/></svg></span><span>账号管理</span></a><a class="sidebar-link" href="role-list.html"><span class="icon"><svg viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 4.5 2.9 7.9 7 10 4.1-2.1 7-5.5 7-10V6l-7-3Z"/><path d="M9 12h6m-3-3v6"/></svg></span><span>岗位管理</span></a></div></aside><main class="main-content"><section class="page-head"><a class="back" id="backLink" href="consumption-list.html">← 返回消费记录</a><h2 id="title">消费详情</h2><p id="pageDescription">本次调用的消费与扣减明细。</p></section><article class="detail"><section class="section"><h3>消费概览</h3><div class="overview-grid"><div class="overview-item"><span class="label">消费单号</span><span class="value strong" id="order">—</span></div><div class="overview-item"><span class="label">消费时间</span><span class="value" id="consumedAt">—</span></div><div class="overview-item"><span class="label">智能体</span><span class="value" id="agentName">—</span></div><div class="overview-item"><span class="label">消费人</span><span class="value" id="memberName">—</span></div><div class="overview-item"><span class="label">消费彩豆</span><span class="value amount" id="totalAmount">—</span></div><div class="overview-item"><span class="label">开票状态</span><span class="value" id="invoiceStatus">—</span></div></div></section><section class="section"><h3>扣减明细</h3><div class="source-cards" id="sourceCards"></div></section></article></main><script>var records={
