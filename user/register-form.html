<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>填写注册信息 · 彩翼平台</title><link href="../styles.css" rel="stylesheet"/><script src="../app.js"></script><script src="login-modal.js" defer></script><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,rgba(145,185,255,.24),transparent 25rem),#f6f9ff;color:#233755;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}.topbar{height:68px;background:#fff;border-bottom:1px solid #e7edf7;display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,5vw);position:sticky;top:0;z-index:100}.topbar-brand{display:flex;align-items:center;gap:14px}.topbar-brand img{height:34px}.topbar-brand span{font-size:15px;font-weight:650;border-left:1px solid #dce4f1;padding-left:14px}.topbar-right{font-size:13px;color:#6d7e95}.topbar-right a{color:#3974df;text-decoration:none;font-weight:650}.page-wrap{max-width:780px;margin:0 auto;padding:42px 22px 64px}.steps{display:flex;align-items:center;margin-bottom:26px}.step{display:flex;align-items:center;gap:7px;font-size:12px;white-space:nowrap}.step-circle{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:650}.step.done .step-circle{background:#d9f7ed;color:#12966c}.step.active .step-circle{background:#3f77e6;color:#fff;box-shadow:0 4px 10px rgba(63,119,230,.22)}.step.todo .step-circle{background:#e8edf5;color:#8190a5}.step.done .step-label{color:#12966c}.step.active .step-label{color:#3f77e6;font-weight:650}.step.todo .step-label{color:#8b99ad}.step-line{height:1px;flex:1;background:#d9e2ef;margin:0 10px}.step-line.done{background:#79cbb3}.type-badge{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid #cddcfa;background:#edf4ff;border-radius:10px;padding:10px 14px;margin-bottom:16px}.type-badge-text{font-size:13px;font-weight:650;color:#3467d7}.type-badge-change{font-size:12px;color:#617694;text-decoration:none}.form-card{background:#fff;border:1px solid #dce6f5;border-radius:14px;box-shadow:0 8px 20px rgba(36,66,109,.045);padding:27px 30px;margin-bottom:14px}.section-title{font-size:14px;font-weight:650;color:#24344c;margin-bottom:18px;padding-bottom:13px;border-bottom:1px solid #e7edf6;display:flex;align-items:center;gap:8px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.row1{display:grid;grid-template-columns:1fr;gap:16px}.fg{display:flex;flex-direction:column;gap:6px}.fg label{font-size:13px;font-weight:550;color:#3c4b61}.req{color:#e25353}.opt{font-weight:400;color:#94a2b5}.fg input{height:43px;border:1px solid #d5e0ee;border-radius:8px;padding:0 12px;font-size:14px;color:#27374f;background:#fff;transition:.18s}.fg input:focus{outline:none;border-color:#5c8bf2;box-shadow:0 0 0 3px #e9f0ff}.hint{font-size:12px;color:#8a99ae}.hint.info{color:#3467d7;background:#edf4ff;padding:6px 9px;border-radius:6px;display:none}.input-group{display:flex;gap:8px}.input-group input{flex:1}.code-btn{height:43px;padding:0 14px;background:#edf4ff;color:#3467d7;border:1px solid #c6d8fc;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}.code-btn:disabled{background:#f1f5f9;color:#94a3b8;border-color:#dfe4ee;cursor:not-allowed}.upload-area{border:1px dashed #b7c9e5;border-radius:10px;padding:24px 20px;text-align:center;cursor:pointer;background:#f9fbff;transition:.18s}.upload-area:hover{border-color:#5c8bf2;background:#f3f7ff}.upload-icon{font-size:30px;margin-bottom:9px}.upload-text{font-size:13px;color:#425671;font-weight:600}.upload-hint{font-size:12px;color:#8a99ae;margin-top:5px}.upload-area input[type=file]{display:none}.agreement-box{display:flex;align-items:flex-start;gap:10px;margin:18px 0 14px;padding:12px 15px;background:#f8fbff;border:1px solid #dfe8f4;border-radius:9px}.agreement-box input{width:16px;height:16px;margin-top:2px}.agreement-text{font-size:13px;color:#53657d;line-height:1.6}.agreement-text a{color:#3467d7;text-decoration:none;font-weight:600}.submit-btn{width:100%;height:48px;border:0;border-radius:9px;background:#3f77e6;color:#fff;font-size:15px;font-weight:650;cursor:pointer;box-shadow:0 7px 15px rgba(63,119,230,.19)}.submit-btn:hover{background:#2f64d3}.submit-btn:disabled{background:#9baac0;box-shadow:none;cursor:not-allowed}.submit-hint{text-align:center;color:#8493a9;font-size:12px;margin-top:10px}.modal-mask{display:none;position:fixed;inset:0;background:rgba(12,24,42,.45);z-index:200;align-items:center;justify-content:center}.modal-mask.show{display:flex}.modal-card{background:#fff;border-radius:14px;width:90%;max-width:420px;padding:25px;box-shadow:0 16px 48px rgba(5,16,32,.2)}.modal-card.wide{max-width:560px}.modal-title{font-size:16px;font-weight:700;margin-bottom:10px}.modal-body,.modal-scroll{font-size:13px;color:#52647d;line-height:1.7;margin-bottom:20px}.modal-scroll{max-height:50vh;overflow:auto;background:#f7faff;border:1px solid#e1e9f4;border-radius:8px;padding:14px;white-space:pre-line}.modal-actions{display:flex;gap:10px;justify-content:flex-end}.modal-btn{height:38px;padding:0 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid #d6e1ef;background:#fff;color:#65768c}.modal-btn.primary{background:#3f77e6;border-color:#3f77e6;color:#fff}.toast{position:fixed;top:76px;left:50%;transform:translateX(-50%) translateY(-12px);background:#24344e;color:#fff;font-size:13px;padding:10px 18px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:.25s;z-index:300}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.field-error{border-color:#ef4444!important;box-shadow:0 0 0 3px #fee2e2!important}@media(max-width:620px){.topbar-brand span{display:none}.page-wrap{padding:30px 16px 50px}.form-card{padding:22px 18px}.row2{grid-template-columns:1fr}.step-label{display:none}.steps{gap:0}.step-line{margin:0 7px}}</style></head><body><header class="topbar"><div class="topbar-brand"><img alt="彩翼高科" src="../logo.dc57457c.png"/><span>彩翼公共采购智能体协同管理平台</span></div><div class="topbar-right">已有账号？<a href="#" data-login-modal>登录</a></div></header><main class="page-wrap"><div class="steps"><div class="step done"><div class="step-circle">✓</div><span class="step-label">选择类型</span></div><div class="step-line done"></div><div class="step active"><div class="step-circle">2</div><span class="step-label">填写信息</span></div><div class="step-line"></div><div class="step todo"><div class="step-circle">3</div><span class="step-label">手机验证</span></div><div class="step-line"></div><div class="step todo" id="finalStep"><div class="step-circle">4</div><span class="step-label">等待审核</span></div></div><div class="type-badge"><span class="type-badge-text" id="typeBadge">采购单位</span><a class="type-badge-change" href="#" onclick="return confirmChangeType()">更换类型 ›</a></div><section class="form-card enterprise-only"><div class="section-title">📄 营业执照 <span class="req">*</span> <span class="opt">上传后自动识别企业信息</span></div><div class="upload-area" id="uploadArea" onclick="document.getElementById('licFile').click()"><input accept="image/*,.pdf" id="licFile" type="file" onchange="handleLicenseUpload(this)"/><div class="upload-icon">📄</div><div class="upload-text">点击上传营业执照</div><div class="upload-hint">支持 JPG、PNG、PDF，文件大小 ≤ 10MB</div><div id="fileName" style="display:none;margin-top:8px;font-size:13px;color:#3467d7"></div><div id="ocrStatus" style="display:none;margin-top:6px;font-size:12px"></div></div></section><section class="form-card enterprise-only"><div class="section-title">🏢 企业信息</div><div class="row1" style="margin-bottom:14px"><div class="fg"><label>组织名称 <span class="req">*</span></label><input id="orgName" placeholder="请输入组织全称" type="text"/></div></div><div class="row2"><div class="fg"><label>统一社会信用代码 <span class="req">*</span></label><input id="creditCode" maxlength="18" placeholder="18位统一社会信用代码" type="text" oninput="checkCreditCode(this)"/><span class="hint info" id="creditHint">⚡ 该组织已注册，已带入组织名称；本次将新增机构类型。</span><span class="hint">填写后系统自动查重，同一组织可新增多种机构类型</span></div></div></section><section class="form-card"><div class="section-title">👤 经办人信息</div><div class="row2"><div class="fg"><label>真实姓名 <span class="req">*</span></label><input placeholder="请输入真实姓名" type="text"/></div><div class="fg" id="idCardGroup"><label>身份证号 <span class="opt">（选填）</span></label><input id="idCard" placeholder="请输入身份证号" type="text"/></div><div class="fg"><label>昵称 <span class="opt">（选填）</span></label><input placeholder="不填默认使用真实姓名" type="text"/></div></div></section><section class="form-card"><div class="section-title">🔑 账号信息</div><div class="row2"><div class="fg"><label>手机号 <span class="req">*</span></label><div class="input-group"><input id="phone" maxlength="11" placeholder="11位手机号，将作为登录账号" type="tel"/><button class="code-btn" id="codeBtn" onclick="startCountdown()" type="button">获取验证码</button></div></div><div class="fg"><label>短信验证码 <span class="req">*</span></label><input maxlength="6" placeholder="6位验证码" type="text"/></div><div class="fg"><label>登录密码 <span class="req">*</span></label><input placeholder="至少8位" type="password"/></div><div class="fg"><label>确认密码 <span class="req">*</span></label><input placeholder="请再次输入密码" type="password"/></div></div></section><div class="agreement-box"><input type="checkbox" id="agreementCheck" onchange="toggleSubmitBtn()"/><label class="agreement-text" for="agreementCheck">我已阅读并接受<a href="#" onclick="showAgreement('user');return false">《用户协议》</a>与<a href="#" onclick="showAgreement('privacy');return false">《隐私政策》</a></label></div><button class="submit-btn" id="submitBtn" onclick="submitForm()" disabled>提交申请 →</button><div class="submit-hint" id="submitHint">提交后将进入审核，结果将通过短信通知</div></main><div class="modal-mask" id="changeTypeModal"><div class="modal-card"><div class="modal-title">更换机构类型？</div><div class="modal-body">更换类型将清空当前已填写的信息，并返回类型选择页重新开始。</div><div class="modal-actions"><button class="modal-btn" onclick="closeModal('changeTypeModal')">继续填写</button><button class="modal-btn primary" onclick="location.href='register-select.html'">更换类型</button></div></div></div><div class="modal-mask" id="agreementModal"><div class="modal-card wide"><div class="modal-title" id="agreementTitle">用户协议</div><div class="modal-scroll" id="agreementBody"></div><div class="modal-actions"><button class="modal-btn primary" onclick="closeModal('agreementModal')">我知道了</button></div></div></div><div class="toast" id="toast"><span id="toastMsg"></span></div><script>const typeMap={buyer:'采购单位',supplier:'供应商',agency:'代理机构',developer:'开发者',individual:'个人用户',supervisor:'采购监管'};(function(){const t=new URLSearchParams(location.search).get('type')||'buyer';document.getElementById('typeBadge').textContent=typeMap[t]||'采购单位';if(t==='individual'){document.querySelectorAll('.enterprise-only').forEach(el=>el.style.display='none');const f=document.getElementById('idCardGroup');f.querySelector('.opt').innerHTML='<span class="req">*</span>';f.querySelector('input').placeholder='18位身份证号，用于身份核验与查重';f.querySelector('input').required=true;document.getElementById('finalStep').querySelector('.step-label').textContent='等待审核';document.getElementById('submitHint').textContent='提交后进入运营审核，审核通过后激活账号并发放免费体验权益'}})();let timer=null;function startCountdown(){const b=document.getElementById('codeBtn'),p=document.getElementById('phone');if(!p.value||p.value.length<11){showToast('请先填写11位手机号',p);return}let s=60;b.disabled=true;b.textContent=s+'s后重发';timer=setInterval(function(){s--;b.textContent=s+'s后重发';if(s<=0){clearInterval(timer);b.disabled=false;b.textContent='获取验证码'}},1000)}function checkCreditCode(el){const h=document.getElementById('creditHint'),o=document.getElementById('orgName');if(el.value.length===18){h.style.display='block';setTimeout(function(){o.value='广州某某科技有限公司';o.readOnly=true;o.style.background='#f1f5f9';o.style.color='#64748b'},300)}else{h.style.display='none';o.readOnly=false;o.style.background='';o.style.color=''}}function handleLicenseUpload(input){if(!(input.files&&input.files[0]))return;const e=document.getElementById('fileName');e.textContent='✓ '+input.files[0].name;e.style.display='block';document.getElementById('uploadArea').style.borderColor='';const s=document.getElementById('ocrStatus');s.style.display='block';s.style.color='#3467d7';s.textContent='⏳ 正在识别营业执照信息…';setTimeout(function(){document.getElementById('orgName').value='广州某某科技有限公司';document.getElementById('creditCode').value='91440101MA9W2XYZ3K';s.style.color='#12966c';s.textContent='✓ 识别完成，已自动填入组织名称与统一社会信用代码，请核对'},1200)}function submitForm(){const t=new URLSearchParams(location.search).get('type')||'buyer',o=document.getElementById('orgName'),c=document.getElementById('creditCode'),p=document.getElementById('phone'),i=document.getElementById('idCard');if(t!=='individual'){const l=document.getElementById('licFile');if(!l||!l.files||!l.files.length){showToast('请先上传营业执照');document.getElementById('uploadArea').style.borderColor='#ef4444';return}if(!o||!o.value.trim()){showToast('请填写组织名称',o);return}if(!c||!c.value.trim()){showToast('请填写统一社会信用代码',c);return}}if(t==='individual'&&(!i||!i.value.trim())){showToast('请填写身份证号',i);return}if(!p||!p.value.trim()||p.value.length<11){showToast('请填写11位手机号',p);return}location.href=t==='individual'?'register-success.html?type=individual':'register-success.html'}function confirmChangeType(){document.getElementById('changeTypeModal').classList.add('show');return false}function closeModal(id){document.getElementById(id).classList.remove('show')}let toastTimer=null;function showToast(msg,input){const t=document.getElementById('toast');document.getElementById('toastMsg').textContent=msg;t.classList.add('show');if(input){input.classList.add('field-error');input.focus();input.addEventListener('input',function h(){input.classList.remove('field-error');input.removeEventListener('input',h)})}clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2400)}document.querySelectorAll('.modal-mask').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('show')}));function toggleSubmitBtn(){document.getElementById('submitBtn').disabled=!document.getElementById('agreementCheck').checked}function showAgreement(type){document.getElementById('agreementTitle').textContent=type==='user'?'用户协议':'隐私政策';document.getElementById('agreementBody').textContent=type==='user'?'【用户协议示例内容】\n\n1. 账号注册与使用规则\n您注册彩翼平台账号即表示同意遵守平台使用规范...\n\n2. 服务内容\n彩翼平台为用户提供智能体采购、充值、使用等服务...\n\n3. 用户权利与义务\n用户有权使用平台提供的各项服务，同时需遵守相关法律法规...':'【隐私政策示例内容】\n\n1. 信息收集范围\n我们收集您的注册信息、使用记录等必要数据...\n\n2. 信息使用目的\n收集的信息仅用于提供服务、改进产品体验...\n\n3. 信息保护措施\n我们采用行业标准的安全技术保护您的个人信息...';document.getElementById('agreementModal').classList.add('show')}</script></body></html>
