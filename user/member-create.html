<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>新增子账号 - 用户端</title><link href="../styles.css" rel="stylesheet"/><style>body{background:#f6f8fc}.main-content{padding:28px 32px}.page-header{background:linear-gradient(115deg,#fff,#eff6ff);border:1px solid #d9e6fa;border-radius:16px;padding:24px 27px;margin-bottom:18px}.page-header h2{margin:0;color:#172b4d}.page-header p{margin:6px 0 0;color:#708199;font-size:13px}.form-card{max-width:760px;padding:24px 28px;border:1px solid #e6ecf5;border-radius:14px;background:#fff}.section{margin-top:22px;padding-top:20px;border-top:1px solid #edf1f6}.section:first-child{margin-top:0;padding-top:0;border:0}.section h3{margin:0 0 14px;font-size:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field label{display:block;margin-bottom:6px;font-size:13px;color:#42536c}.field input,.field select{width:100%;height:42px;padding:0 11px;border:1px solid #d9e4f2;border-radius:8px;font-size:14px}.hint{margin-top:6px;color:#8291a6;font-size:12px}.result{display:none;margin-top:14px;padding:12px;border-radius:9px;background:#effcf6;color:#06734c;font-size:13px}.actions{display:flex;gap:10px;margin-top:25px;padding-top:20px;border-top:1px solid #edf1f6}@media(max-width:650px){.main-content{padding:18px 16px}.grid{grid-template-columns:1fr}.actions{flex-direction:column}.actions .btn{justify-content:center}}</style></head><body><header class="top-bar user"><div class="top-bar-left"><a class="top-bar-logo" href="../index.html"><img alt="彩翼高科" class="logo-img" src="../logo.dc57457c.png"/></a><span class="top-bar-title">彩翼公共采购智能体协同管理平台</span></div></header><main class="main-content"><div class="page-header"><a href="member-list.html" style="color:#2563eb;text-decoration:none;font-size:13px">← 返回成员与岗位</a><h2 style="margin-top:9px">新增子账号</h2><p>填写员工信息并分配岗位；系统将按手机号判断直接关联或发送激活邀请。</p></div><form class="form-card" onsubmit="createMember(event)"><div class="section"><h3>员工信息</h3><div class="grid"><div class="field"><label>姓名 <b style="color:#ef4444">*</b></label><input id="name" required placeholder="请输入员工姓名"/></div><div class="field"><label>手机号 <b style="color:#ef4444">*</b></label><input id="phone" required maxlength="11" placeholder="请输入11位手机号"/><div class="hint">已注册手机号将直接关联；未注册手机号将收到激活邀请。</div></div></div></div><div class="section"><h3>岗位分配</h3><div class="grid"><div class="field"><label>选择岗位 <b style="color:#ef4444">*</b></label><select id="role" required><option value="">请选择岗位</option><option>机构管理员</option><option>业务操作员</option><option>财务专员</option><option>只读人员</option><option>采购专员（自定义）</option></select></div><div class="field"><label>附加岗位</label><select><option>不添加</option><option>只读人员</option><option>财务专员</option></select><div class="hint">子账号可拥有多个岗位，权限按岗位并集生效。</div></div></div></div><div class="section"><h3>权限提示</h3><div class="hint" style="font-size:13px;line-height:1.75">若分配岗位包含“智能体市场查看”和“智能体调用”权限，且该手机号的平台个人账号从未获得免费体验资格，员工完成激活后将获得一次性新用户免费体验资格。</div></div><div class="result" id="result"></div><div class="actions"><button class="btn btn-primary" type="submit">保存并发送邀请</button><a class="btn btn-outline" href="member-list.html">取消</a></div></form></main><script>function createMember(e){e.preventDefault();var n=document.getElementById('name').value.trim(),p=document.getElementById('phone').value.trim(),r=document.getElementById('role').value;var registered=p.endsWith('8');var box=document.getElementById('result');box.style.display='block';box.textContent=registered?'已关联已有平台个人账号，已为「'+n+'」分配「'+r+'」岗位。':'已创建待激活子账号，邀请已发送至 '+p+'；员工完成激活后将自动关联机构与岗位。'}</script></body></html>
