<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>注册 - 用户端</title>
<link href="../styles.css" rel="stylesheet"/>
<script src="../app.js"></script>
<style>
        .mobile-frame { background: var(--bg-color); }
        .app-container { min-height: 100vh; background: var(--bg-color); }
        .nav-header { display: flex; align-items: center; justify-content: space-between; padding: var(--spacing-md) var(--spacing-lg); background: white; border-bottom: 1px solid var(--border-light); }
        .nav-header.transparent { background: transparent; border-bottom: none; }
        .nav-header h1 { font-size: 18px; font-weight: 600; margin: 0; }
        .back-btn { background: none; border: none; padding: var(--spacing-xs); cursor: pointer; }
        .header-right { width: 40px; }
        .invite-banner { display: none; padding: var(--spacing-md) var(--spacing-lg); background: linear-gradient(135deg, #E6F7FF 0%, #BAE7FF 100%); }
        .invite-banner.show { display: block; }
        .invite-banner-content { display: flex; align-items: center; gap: var(--spacing-sm); font-size: 14px; color: #1890FF; }
        .invite-banner-content strong { color: var(--primary-color); }
        .register-form { padding: var(--spacing-lg); background: white; margin: var(--spacing-lg); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); }
        .form-group { margin-bottom: var(--spacing-lg); }
        .form-group label { display: block; font-size: 14px; font-weight: 500; margin-bottom: var(--spacing-sm); color: var(--text-primary); }
        .form-group label .optional { color: var(--text-muted); font-weight: normal; }
        .input-group { display: flex; gap: var(--spacing-sm); }
        .input-group input { flex: 1; }
        .form-group input { width: 100%; height: 48px; padding: 0 var(--spacing-md); border: 1px solid var(--border-color); border-radius: var(--radius-md); font-size: 15px; box-sizing: border-box; }
        .form-group input:focus { outline: none; border-color: var(--primary-color); }
        .form-group input.invite-code-input { text-transform: uppercase; letter-spacing: 2px; font-weight: 600; }
        .form-group input.locked { background: var(--bg-light); color: var(--text-muted); }
        .get-code-btn { width: 110px; height: 48px; background: var(--primary-light); color: var(--primary-color); border: 1px solid var(--primary-color); border-radius: var(--radius-md); font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap; }
        .get-code-btn:disabled { background: var(--bg-light); color: var(--text-muted); border-color: var(--border-color); cursor: not-allowed; }
        .form-agreement { margin-bottom: var(--spacing-lg); }
        .checkbox-label { display: flex; align-items: flex-start; gap: var(--spacing-sm); font-size: 13px; color: var(--text-secondary); cursor: pointer; }
        .checkbox-label input { width: 18px; height: 18px; margin-top: 2px; }
        .checkbox-label a { color: var(--primary-color); text-decoration: none; }
        .btn-block { width: 100%; height: 48px; font-size: 16px; }
        .login-link { text-align: center; margin-top: var(--spacing-lg); font-size: 14px; color: var(--text-secondary); }
        .login-link a { color: var(--primary-color); text-decoration: none; font-weight: 500; }
        .countdown-modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
        .countdown-modal.active { display: flex; }
        .countdown-content { background: white; border-radius: var(--radius-xl); padding: var(--spacing-xl); text-align: center; width: 280px; }
        .countdown-timer { font-size: 48px; font-weight: 700; color: var(--primary-color); margin: var(--spacing-md) 0; }
        .countdown-tip { font-size: 14px; color: var(--text-muted); }
        .toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.75); color: white; padding: 12px 24px; border-radius: 8px; font-size: 14px; z-index: 2000; opacity: 0; visibility: hidden; transition: all 0.3s; }
        .toast.show { opacity: 1; visibility: visible; }
    </style>
</head>
<body class="mobile-frame">
<div class="app-container">
<header class="nav-header transparent">
<button class="back-btn" onclick="history.back()">
<svg fill="none" height="24" viewbox="0 0 24 24" width="24"><path d="M15 18L9 12L15 6" stroke="#333" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</button>
<h1>注册</h1>
<div class="header-right"></div>
</header>
<main class="main-content" style="padding: 0;">
<form class="register-form" id="registerForm">
<div class="form-group">
<label>手机号</label>
<div class="input-group">
<input id="phone" maxlength="11" placeholder="请输入手机号" required="" type="tel"/>
<button class="get-code-btn" id="getCodeBtn" onclick="sendVerifyCode()" type="button">获取验证码</button>
</div>
</div>
<div class="form-group">
<label>验证码</label>
<input id="verifyCode" maxlength="6" placeholder="请输入6位验证码" required="" type="text"/>
</div>
<div class="form-group">
<label>设置密码</label>
<input id="password" maxlength="20" minlength="8" placeholder="8-20位字母数字组合" required="" type="password"/>
</div>
<div class="form-group">
<label>确认密码</label>
<input id="confirmPassword" maxlength="20" minlength="8" placeholder="请再次输入密码" required="" type="password"/>
</div>
<div class="form-group">
<label>合作机构邀请码（选填）</label>
<input class="invite-code-input" id="inviteCode" maxlength="12" placeholder="如有渠道商邀请码请填写" type="text"/>
<p style="font-size:12px;color:var(--text-muted);margin-top:6px;">填写有效邀请码即确认与该渠道商的推荐关系（依据《非传统业务拓展合作管理办法（试行）》第九条）</p>
</div>
<div id="inviteBanner" style="display:none;background:var(--klein-light);border:1px solid var(--klein);border-radius:var(--radius-md);padding:10px 14px;margin-bottom:var(--spacing-md);font-size:13px;color:var(--klein);">已通过渠道商推广链接进入，邀请码已自动填入</div>
<div class="form-agreement">
<label class="checkbox-label">
<input id="agreeTerms" type="checkbox"/>
<span class="checkmark"></span>
<span>我已阅读并同意 <a href="#">《用户协议》</a> 和 <a href="#">《隐私政策》</a></span>
</label>
</div>
<button class="btn btn-primary btn-block" type="submit">立即注册</button>
<p class="login-link">已有账号？<a href="#">立即登录</a></p>
</form>
</main>
</div>
<div class="countdown-modal" id="countdownModal">
<div class="countdown-content">
<p>验证码已发送至您的手机</p>
<div class="countdown-timer" id="countdownTimer">60</div>
<p class="countdown-tip">秒后可重新获取</p>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const inviteCode = urlParams.get('invite_code');
            if (inviteCode) {
                document.getElementById('inviteBanner').style.display = 'block';
                const input = document.getElementById('inviteCode');
                input.value = inviteCode;
                input.readOnly = true;
                input.classList.add('locked');
            }
        });
        let countdown = 60, timer = null;
        function sendVerifyCode() {
            const phone = document.getElementById('phone').value;
            const btn = document.getElementById('getCodeBtn');
            if (!phone || phone.length !== 11) { showToast('请输入正确的手机号'); return; }
            btn.disabled = true;
            countdown = 60;
            updateCountdown();
            showCountdownModal();
            showToast('验证码已发送');
        }
        function updateCountdown() {
            const btn = document.getElementById('getCodeBtn');
            timer = setInterval(() => {
                countdown--;
                btn.textContent = countdown + 's';
                document.getElementById('countdownTimer').textContent = countdown;
                if (countdown <= 0) {
                    clearInterval(timer);
                    btn.disabled = false;
                    btn.textContent = '获取验证码';
                    closeCountdownModal();
                }
            }, 1000);
        }
        function showCountdownModal() { document.getElementById('countdownModal').classList.add('active'); }
        function closeCountdownModal() { document.getElementById('countdownModal').classList.remove('active'); }
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const phone = document.getElementById('phone').value;
            const verifyCode = document.getElementById('verifyCode').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const agreeTerms = document.getElementById('agreeTerms').checked;
            if (!phone || phone.length !== 11) { showToast('请输入正确的手机号'); return; }
            if (!verifyCode || verifyCode.length !== 6) { showToast('请输入6位验证码'); return; }
            if (password.length < 8) { showToast('密码至少8位'); return; }
            if (password !== confirmPassword) { showToast('两次密码不一致'); return; }
            if (!agreeTerms) { showToast('请同意用户协议'); return; }
            showToast('注册成功');
            setTimeout(() => { window.location.href = 'agent-list.html'; }, 1500);
        });
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }
    </script>
</body>
</html>
