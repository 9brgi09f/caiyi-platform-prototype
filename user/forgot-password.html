<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>重置密码 · 彩翼平台</title>
<link rel="stylesheet" href="../styles.css"/>
<script src="../app.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#fff;color:#1e293b;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}.reset-page{min-height:100vh;background:linear-gradient(145deg,#fff 0%,#f8fbff 100%)}.home-topbar{height:68px;display:flex;align-items:center;padding:0 32px;background:#fff;border-bottom:1px solid #e5edf7}.home-brand{display:flex;align-items:center;gap:14px}.home-brand img{height:35px}.home-brand span{padding-left:14px;border-left:1px solid #dbe4f1;font-size:16px;font-weight:650;color:#253756}.reset-wrap{width:min(430px,calc(100% - 40px));margin:calc(50vh - 280px) auto 50px}.reset-card{background:#fff;border:1px solid #e0e9f6;border-radius:16px;padding:32px 34px 30px;box-shadow:0 16px 36px rgba(38,74,130,.1)}.back-link{display:inline-flex;align-items:center;gap:5px;margin-bottom:18px;color:#3974df;font-size:13px;font-weight:600;text-decoration:none}.reset-title{margin:0 0 8px;font-size:23px;color:#263954;text-align:center}.reset-sub{margin:0 0 25px;color:#71839c;text-align:center;font-size:13px;line-height:1.7}.steps{display:flex;align-items:center;justify-content:center;gap:7px;margin-bottom:25px}.step{display:flex;align-items:center;gap:6px;color:#8b9ab0;font-size:12px}.step b{display:grid;place-items:center;width:21px;height:21px;border-radius:50%;background:#e7edf6;color:#8291a6;font-size:11px}.step.active{color:#3974df;font-weight:650}.step.active b,.step.done b{background:#3f77e6;color:#fff}.step-line{height:1px;width:30px;background:#dbe4f1}.step-line.done{background:#78a3ef}.view{display:none}.view.active{display:block}.fg{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}.fg label{font-size:13px;font-weight:600;color:#3b4d68}.fg input{width:100%;height:43px;padding:0 12px;border:1px solid #d8e3f1;border-radius:8px;color:#263954;font-size:14px;outline:none}.fg input:focus{border-color:#5d8ff0;box-shadow:0 0 0 3px #eaf1ff}.code-row{display:flex;gap:8px}.code-row input{flex:1;min-width:0}.code-btn{min-width:102px;border:1px solid #c8dcff;border-radius:8px;background:#eef5ff;color:#3974df;font-weight:600;cursor:pointer}.code-btn:disabled{background:#f1f5f9;border-color:#e0e7f1;color:#98a5b7;cursor:not-allowed}.submit-btn{width:100%;height:45px;margin-top:6px;border:0;border-radius:8px;background:#3f77e6;color:#fff;font-size:15px;font-weight:650;cursor:pointer}.submit-btn:hover{background:#3068d7}.password-hint{margin:-4px 0 14px;font-size:12px;color:#8797ad}.message{display:none;margin-bottom:13px;padding:9px 11px;border-radius:7px;background:#fff3f2;color:#d1544e;font-size:12px;line-height:1.45}.message.show{display:block}.success-icon{display:grid;place-items:center;width:64px;height:64px;margin:3px auto 17px;border-radius:50%;background:#dff8ed;color:#12966c;font-size:31px;box-shadow:inset 0 0 0 1px #b9ebd7}.success-view{text-align:center}.success-view h2{margin:0 0 9px;font-size:22px;color:#263954}.success-view p{margin:0 0 23px;font-size:13px;line-height:1.7;color:#71839c}.success-view .submit-btn{display:block;text-decoration:none;line-height:45px;margin-top:0}@media(max-width:600px){.home-topbar{padding:0 22px}.reset-wrap{margin:40px auto}}@media(max-width:460px){.home-brand span{display:none}.reset-wrap{width:calc(100% - 28px)}.reset-card{padding:28px 20px 24px}.step-line{width:18px}.step{font-size:11px}}
</style>
</head>
<body>
<div class="reset-page"><header class="home-topbar"><div class="home-brand"><img alt="彩翼高科" src="../logo.dc57457c.png"/><span>彩翼公共采购智能体协同管理平台</span></div></header><main class="reset-wrap"><section class="reset-card"><a class="back-link" href="login.html">← 返回登录</a><div class="steps"><div class="step active" id="stepOne"><b>1</b>验证手机号</div><span class="step-line" id="lineOne"></span><div class="step" id="stepTwo"><b>2</b>设置新密码</div><span class="step-line" id="lineTwo"></span><div class="step" id="stepThree"><b>3</b>完成</div></div>
<div class="view active" id="verifyView"><h1 class="reset-title">忘记密码</h1><p class="reset-sub">验证注册手机号后，即可重新设置登录密码。</p><div class="message" id="verifyMessage"></div><div class="fg"><label for="phone">注册手机号</label><input id="phone" maxlength="11" placeholder="请输入注册手机号" type="tel"/></div><div class="fg"><label for="code">短信验证码</label><div class="code-row"><input id="code" maxlength="6" placeholder="请输入6位验证码" type="text"/><button class="code-btn" id="codeBtn" type="button" onclick="sendCode()">获取验证码</button></div></div><button class="submit-btn" type="button" onclick="verifyPhone()">下一步</button></div>
<div class="view" id="passwordView"><h1 class="reset-title">设置新密码</h1><p class="reset-sub">请设置至少 8 位的新登录密码。</p><div class="message" id="passwordMessage"></div><div class="fg"><label for="newPassword">新密码</label><input id="newPassword" placeholder="请输入新密码" type="password"/></div><p class="password-hint">建议使用字母、数字和符号组合，提高账号安全性。</p><div class="fg"><label for="confirmPassword">确认新密码</label><input id="confirmPassword" placeholder="请再次输入新密码" type="password"/></div><button class="submit-btn" type="button" onclick="resetPassword()">确认重置</button></div>
<div class="view success-view" id="successView"><div class="success-icon">✓</div><h2>密码已重置</h2><p>新密码已生效，请使用新密码重新登录。</p><a class="submit-btn" href="login.html">返回登录</a></div>
</section></main></div>
<script>
function showMessage(id,text){var el=document.getElementById(id);el.textContent=text;el.classList.add('show')}
function clearMessage(id){document.getElementById(id).classList.remove('show')}
function isPhoneValid(){return /^1\d{10}$/.test(document.getElementById('phone').value.trim())}
function sendCode(){var phone=document.getElementById('phone'),button=document.getElementById('codeBtn');if(!isPhoneValid()){showMessage('verifyMessage','请先填写11位注册手机号');phone.focus();return}clearMessage('verifyMessage');var seconds=60;button.disabled=true;button.textContent=seconds+'s后重发';var timer=setInterval(function(){seconds--;button.textContent=seconds+'s后重发';if(seconds<=0){clearInterval(timer);button.disabled=false;button.textContent='获取验证码'}},1000)}
function showView(name){document.querySelectorAll('.view').forEach(function(view){view.classList.remove('active')});document.getElementById(name).classList.add('active');var step=name==='verifyView'?1:name==='passwordView'?2:3;['stepOne','stepTwo','stepThree'].forEach(function(id,index){var el=document.getElementById(id);el.classList.toggle('active',index+1===step);el.classList.toggle('done',index+1<step)});document.getElementById('lineOne').classList.toggle('done',step>1);document.getElementById('lineTwo').classList.toggle('done',step>2)}
function verifyPhone(){var code=document.getElementById('code');if(!isPhoneValid()){showMessage('verifyMessage','请填写11位注册手机号');return}if(!/^\d{6}$/.test(code.value.trim())){showMessage('verifyMessage','请填写6位短信验证码');code.focus();return}clearMessage('verifyMessage');showView('passwordView')}
function resetPassword(){var password=document.getElementById('newPassword'),confirm=document.getElementById('confirmPassword');if(password.value.length<8){showMessage('passwordMessage','新密码至少需要 8 位');password.focus();return}if(password.value!==confirm.value){showMessage('passwordMessage','两次输入的密码不一致');confirm.focus();return}clearMessage('passwordMessage');showView('successView')}
</script>
</body>
</html>
