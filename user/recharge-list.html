<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>账户充值 - 用户端</title><link href="../styles.css" rel="stylesheet"/>
<link href="_bento-lite-skin.css" rel="stylesheet">
<link href="_glass-soft-skin.css" rel="stylesheet"/>
<script src="../app.js"></script>
<link href="bean-plan.css" rel="stylesheet"/>
<script src="bean-plan.js"></script><style>
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.page-head h2{margin:0}

.recharge-panel{padding:24px;margin-bottom:18px}
.section-heading{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
.section-heading h3,.records-title{margin:0;color:var(--glass-ink);font-size:17px;font-weight:800}
.section-heading p{margin:0;color:var(--glass-muted);font-size:13px}
.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:18px}
.option{min-height:84px;padding:16px;border:1px solid;text-align:left;cursor:pointer}
.option:hover{box-shadow:0 8px 18px rgba(54,83,150,.08)}
.bento-lite .option.active{border-color:rgba(78,127,255,.55)!important;background:rgba(239,245,255,.72)!important;box-shadow:0 0 0 2px rgba(53,108,246,.10)}
.option b{display:block;color:#354969;font-size:19px;letter-spacing:-.02em}
.option.active b,.amount b{color:var(--bp-value)}
.option span{display:block;margin-top:6px;color:var(--glass-muted);font-size:12px}
.option{position:relative}
.bp-gift-tag{position:absolute;top:12px;right:12px;padding:2px 8px;border-radius:99px;background:#fff1e6;color:#b4531a;font-size:12px;font-style:normal;font-weight:700}
.bp-promo{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin-top:14px;padding:11px 14px;border:1px solid #ffd9bf;border-radius:12px;background:linear-gradient(100deg,#fff6ef,#fffaf5)}
.bp-promo[hidden]{display:none}
.bp-promo b{color:#b4531a;font-size:14px}
.bp-promo span{color:#8a5a3a;font-size:12px}
.amount em{display:block;margin-top:2px;color:var(--glass-muted);font-size:12px;font-style:normal}
.recharge-footer{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr) 158px;align-items:center;gap:18px;margin-top:20px;padding-top:20px;border-top:1px solid rgba(148,170,214,.20)}
.custom label{display:block;margin-bottom:8px;color:var(--glass-muted);font-size:12px;font-weight:700}
.custom-field{display:flex;align-items:center;gap:9px}
.custom input{flex:1;min-width:0;height:42px;padding:0 12px;border-radius:11px;font-size:14px}
.custom-field span,.amount span{color:var(--glass-muted);font-size:12px}
.amount span,.amount b{display:block}
.amount b{margin-top:4px;font-size:24px;letter-spacing:-.02em}
.amount b small{color:var(--glass-muted);font-size:13px;letter-spacing:0}
.submit{width:100%;min-height:42px;margin:0;border-radius:12px}

.records-panel{padding:22px 22px 20px;overflow:hidden}
.records-title{padding:0 2px 16px}
.record-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 -22px;padding:12px 22px;border-block:1px solid rgba(148,170,214,.20)}
.record-tab{padding:7px 12px;border-radius:9px;font-size:13px;cursor:pointer}
.record-tab.active{font-weight:750}
.record-table-wrap{overflow-x:auto}
.record-table{width:100%;min-width:1060px;border-collapse:collapse;font-size:13px}
.record-table th,.record-table td{padding:14px 10px;text-align:left;white-space:nowrap}
.record-table th{font-size:12px;font-weight:700}
.record-table td{border-top:1px solid}
.record-table td.amount-cell,.record-table td.id-cell,.mem{font-weight:650}
.status-badge{display:inline-flex;padding:4px 9px;border-radius:99px;font-size:12px;font-weight:650}
.pay-success{background:#e5f8f0;color:#07845b}
.invoice-pending,.invoice-complete{background:#edf3ff;color:var(--glass-blue-deep)}
.invoice-processing{background:#fff5df;color:#8a6116}
.record-empty{padding:26px;text-align:center;color:var(--glass-muted);font-size:13px}
.hide{display:none}

@media(max-width:760px){
  .recharge-panel{padding:18px}
  .recharge-footer{grid-template-columns:repeat(2,minmax(0,1fr))}
  .submit{grid-column:1/-1}
}
@media(max-width:480px){
  .options{grid-template-columns:1fr}
  .recharge-footer{grid-template-columns:1fr}
}
</style></head><body class="bento-lite"><header class="top-bar user"><div class="top-bar-left"><a class="top-bar-logo" href="../index.html"><img alt="彩翼高科" class="logo-img" src="../logo.dc57457c.png"/></a><span class="top-bar-title">彩翼公共采购智能体协同管理平台</span></div><div class="top-bar-right"><div class="top-bar-user"><div class="top-bar-avatar">张</div><span>示例科技有限公司</span></div></div></header><aside class="sidebar user"><div class="sidebar-section"><a class="sidebar-link" href="index.html"><span class="icon"><svg viewBox="0 0 24 24"><path d="M4 13h6V4H4v9Zm0 7h6v-4H4v4Zm10 0h6v-9h-6v9Zm0-16v4h6V4h-6Z"/></svg></span><span>概览</span></a><a class="sidebar-link" href="agent-list.html"><span class="icon"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 10h8M8 14h5"/></svg></span><span>智能体市场</span></a><a class="sidebar-link active" href="recharge-list.html"><span class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18M16 14h2"/></svg></span><span>账户充值</span></a><a class="sidebar-link" href="payment-accounts.html"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-6 9 6v9H3v-9Z"/><path d="M6 10v9m4-9v9m4-9v9m4-9v9M2 19h20"/></svg></span><span>付款账户</span></a><a class="sidebar-link" href="balance.html"><span class="icon"><svg viewBox="0 0 24 24"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H18a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H6.5A2.5 2.5 0 0 1 4 17.5v-10Z"/><path d="M4 8h13M15 14h3"/></svg></span><span>彩豆管理</span></a><a class="sidebar-link" href="consumption-list.html"><span class="icon"><svg viewBox="0 0 24 24"><path d="M5 20V10m7 10V4m7 16v-7"/></svg></span><span>消费记录</span></a><a class="sidebar-link" href="invoice-list.html"><span class="icon"><svg viewBox="0 0 24 24"><path d="M6 3h9l3 3v15l-3-2-3 2-3-2-3 2V3Z"/><path d="M9 9h6m-6 4h6"/></svg></span><span>发票管理</span></a><a class="sidebar-link" href="member-list.html"><span class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 20c.6-3.4 3-5 7-5s6.4 1.6 7 5"/></svg></span><span>账号管理</span></a><a class="sidebar-link" href="role-list.html"><span class="icon"><svg viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 4.5 2.9 7.9 7 10 4.1-2.1 7-5.5 7-10V6l-7-3Z"/><path d="M9 12h6m-3-3v6"/></svg></span><span>岗位管理</span></a></div></aside><main class="main-content">
<section class="page-head"><div><h2>账户充值</h2></div><button type="button" class="bp-link-btn" data-bp-rules>彩豆规则</button></section>
<section class="stats bp-compose" id="bpCompose" aria-label="彩豆余额"></section>
<section class="panel recharge-panel" id="plans" aria-labelledby="plansTitle"><div class="section-heading"><h3 id="plansTitle">年包</h3><p id="plansSub"></p></div><div class="bp-plans" id="bpPlans"></div></section>
<section class="panel recharge-panel" aria-labelledby="smallTitle"><div class="section-heading"><h3 id="smallTitle">单次充值</h3><p id="smallSub">长期有效</p></div><div class="bp-promo" id="rcPromo" hidden></div><div class="options" id="options"></div><div class="recharge-footer"><div class="custom"><label for="custom">自定义金额</label><div class="custom-field"><input id="custom" type="number" min="1" step="1" placeholder="输入充值金额"/><span>元</span></div><div class="bp-err" id="customErr" hidden></div></div><div class="amount"><span>本次充值</span><b id="amount">100 <small>元</small></b><em id="amountGet"></em></div><button class="btn btn-primary submit" type="button" id="rechargeBtn">立即充值</button><div class="bp-hint" id="planHint" hidden></div></div></section>
<section class="panel records-panel"><h3 class="records-title">充值记录</h3><div class="record-tabs" role="tablist" aria-label="开票状态"><button class="record-tab active" type="button" data-filter="all">全部</button><button class="record-tab" type="button" data-filter="pending">待开票</button><button class="record-tab" type="button" data-filter="processing">开票中</button><button class="record-tab" type="button" data-filter="complete">已开票</button></div><div class="record-table-wrap"><table class="record-table"><thead><tr><th>订单号</th><th>时间</th><th>充值人</th><th>订单类型</th><th>实付金额</th><th>到账彩豆</th><th>其中赠送</th><th>有效期至</th><th>支付方式</th><th>开票状态</th></tr></thead><tbody id="rechargeRecords"></tbody></table><div class="record-empty hide" id="recordEmpty">暂无符合条件的充值记录</div></div><div class="records-footer"><span id="recordCount"></span><div class="pager"><button type="button" aria-label="上一页" id="rcPrev">‹</button><span class="page-current" id="rcCur">1</span><button type="button" aria-label="下一页" id="rcNext">›</button></div></div></section>
</main>
<script>
(function(){
var B=window.BeanPlan, amount=null, invoiceFilter='all', RC_SIZE=6, rcPage=1;
var INV={pending:['待开票','invoice-pending'],processing:['开票中','invoice-processing'],complete:['已开票','invoice-complete']};
var TYPE={plan:'年包',upgrade:'年包升级',recharge:'单次充值'};
function renderCompose(){
  var b=B.buckets(), personal=B.isPersonal();
  var pct=function(v){return b.total>0?(v/b.total*100).toFixed(2)+'%':'0';};
  document.getElementById('bpCompose').classList.toggle('two',!personal);
  document.getElementById('bpCompose').innerHTML=
   '<div class="stat bp-total"><span>'+B.walletName()+'余额</span><b>'+B.fmt(b.total)+' <small>彩豆</small></b>'+
   '<div class="bp-bar" aria-hidden="true"><i class="s-free" style="width:'+pct(b.free)+'"></i><i class="s-plan" style="width:'+pct(b.plan)+'"></i><i class="s-recharge" style="width:'+pct(b.recharge)+'"></i></div>'+
   '<p class="bp-kpi-meta">'+(personal?'1 元 = 1 彩豆':'全体成员共用 · 1 元 = 1 彩豆')+'</p></div>'+
   (personal?'<div class="stat s-free"><span>免费彩豆</span><b>'+B.fmt(b.free)+'</b><p class="bp-kpi-meta bp-exp">'+b.freeExpire.slice(5).replace('-','月')+'日到期</p></div>':'')+
   '<div class="stat s-plan"><span>年包彩豆</span><b>'+B.fmt(b.plan)+'</b><p class="bp-kpi-meta">'+(b.planExpire?b.planExpire+' 到期':'未购买年包')+'</p></div>'+
   '<div class="stat s-recharge"><span>充值彩豆</span><b>'+B.fmt(b.recharge)+'</b><p class="bp-kpi-meta">长期有效'+(b.rechargeGift?' · 累计获赠 '+B.fmtInt(b.rechargeGift):'')+'</p></div>';
}
function li(t){return '<li>'+t+'</li>';}
function renderPlans(){
  var cfg=B.loadCfg(), cp=B.currentPlan();
  document.getElementById('plansSub').textContent='自购买日起 '+cfg.validityMonths+' 个月有效，基础与赠送彩豆同期管理';
  var sale=B.salePlans(cfg);
  document.getElementById('plans').hidden=!sale.length;
  document.getElementById('bpPlans').innerHTML=sale.map(function(p){
    var isCur=cp&&cp.tier===p.tier, foot='', tip='', tag='';
    if(isCur){
      tag='<span class="bp-tag">当前年包</span>';
      tip='<div class="bp-upgrade-tip">剩余 <b>'+B.fmt(cp.remaining)+'</b> / '+B.fmtInt(cp.total)+' 彩豆 · '+cp.expireAt+' 到期<div class="bp-progress"><i style="width:'+Math.max(2,cp.remaining/cp.total*100).toFixed(1)+'%"></i></div></div>';
      foot='<a class="bp-btn ghost" href="recharge-add.html?type=plan&tier='+p.tier+'">再购一份</a>';
    } else if(cp&&p.price>cp.price){
      var c=B.calcUpgrade(cp,p.tier);
      if(c.ok){
        tag='<span class="bp-tag ok">可升级</span>';
        tip='<div class="bp-upgrade-tip">从'+cp.name+'升级：补 <b>'+B.money(c.pay,0)+'</b>，补发 <b>'+B.fmtInt(c.beans)+'</b> 彩豆，有效期不变</div>';
        foot='<a class="bp-btn" href="recharge-add.html?type=upgrade&plan='+encodeURIComponent(cp.id)+'&tier='+p.tier+'">升级到'+B.esc(p.name)+'</a><a class="bp-link bp-alt" href="recharge-add.html?type=plan&tier='+p.tier+'">单独购买</a>';
      } else {
        foot='<a class="bp-btn" href="recharge-add.html?type=plan&tier='+p.tier+'">立即购买</a>';
      }
    } else {
      foot='<a class="bp-btn'+(cp?' ghost':'')+'" href="recharge-add.html?type=plan&tier='+p.tier+'">立即购买</a>';
    }
    return '<article class="bp-plan'+(isCur?' current':'')+'"><div class="bp-plan-head"><span class="bp-plan-name">'+B.esc(p.name)+'</span>'+tag+'</div>'+
      '<div class="bp-plan-price">'+B.money(p.price,0)+'<small>/ 年</small></div>'+
      '<div class="bp-plan-beans">年度总彩豆 <b>'+B.fmtInt(p.total)+'</b></div>'+
      '<ul class="bp-plan-list">'+li('基础 '+B.fmtInt(p.base)+' + 赠送 '+B.fmtInt(p.gift)+' 彩豆')+li('含 '+p.ratio+'% 赠送彩豆')+li(cfg.validityMonths+' 个月有效，可用于全部智能体')+'</ul>'+
      tip+'<div class="bp-plan-foot">'+foot+'</div></article>';
  }).join('');
}
function setAmount(v){amount=v;var g=v?B.rechargeGiftOf(v):0;document.getElementById('amount').innerHTML=(v?B.fmtInt(v):'—')+' <small>元</small>';document.getElementById('amountGet').textContent=v?'到账 '+B.fmtInt(v+g)+' 彩豆'+(g?'（含赠送 '+B.fmtInt(g)+'）':''):'';checkHint();}
function checkHint(){
  var hint=document.getElementById('planHint'), starter=B.cheapestPlan();
  var more=starter?starter.total-(starter.price+B.rechargeGiftOf(starter.price)):0;
  if(amount&&starter&&more>0&&amount>=starter.price){hint.hidden=false;hint.innerHTML='同样支付 '+B.money(starter.price,0)+' 购买'+B.esc(starter.name)+'年包，可多得 '+B.fmtInt(more)+' 彩豆。<a class="bp-link" href="#plans">查看年包</a>';}
  else hint.hidden=true;
}
function renderSmall(){
  var cfg=B.loadCfg(), box=document.getElementById('options');
  document.getElementById('custom').placeholder=cfg.customMin+'–'+B.fmtInt(cfg.customMax)+' 元';
  var promo=B.rechargePromo(cfg), pb=document.getElementById('rcPromo');
  document.getElementById('smallSub').textContent=promo.active?'长期有效 · 赠送彩豆不开票':'不赠送，长期有效';
  pb.hidden=!promo.active;
  if(promo.active) pb.innerHTML='<b>限时充值 '+(promo.ratio===100?'1:1 ':promo.ratio+'% ')+'赠送</b><span>'+promo.start+' 至 '+promo.end+'，档位与自定义金额均按充值金额的 '+promo.ratio+'% 赠送彩豆</span>';
  box.innerHTML=cfg.small.map(function(v,i){var g=B.rechargeGiftOf(v,cfg);return '<button class="option'+(i===0?' active':'')+'" type="button" data-amount="'+v+'"><b>'+B.fmtInt(v)+' 元</b><span>到账 '+B.fmtInt(v+g)+' 彩豆</span>'+(g?'<i class="bp-gift-tag">送 '+B.fmtInt(g)+'</i>':'')+'</button>';}).join('');
  box.querySelectorAll('.option').forEach(function(o){o.onclick=function(){document.getElementById('custom').value='';document.getElementById('customErr').hidden=true;box.querySelectorAll('.option').forEach(function(x){x.classList.toggle('active',x===o);});setAmount(+o.dataset.amount);};});
  setAmount(cfg.small[0]);
}
document.getElementById('custom').addEventListener('input',function(){
  var cfg=B.loadCfg(), v=Number(this.value), err=document.getElementById('customErr');
  document.querySelectorAll('#options .option').forEach(function(x){x.classList.remove('active');});
  if(!this.value){err.hidden=true;setAmount(null);return;}
  if(!(v>=cfg.customMin&&v<=cfg.customMax)||Math.floor(v)!==v){err.hidden=false;err.textContent='请输入 '+cfg.customMin+'–'+B.fmtInt(cfg.customMax)+' 之间的整数金额';setAmount(null);return;}
  err.hidden=true;setAmount(v);
});
document.getElementById('rechargeBtn').addEventListener('click',function(){
  if(!amount){var err=document.getElementById('customErr');err.hidden=false;err.textContent=err.textContent||'请选择或输入充值金额';document.getElementById('custom').focus();return;}
  location.href='recharge-add.html?type=recharge&amount='+encodeURIComponent(amount);
});
function renderRecords(){
  var orders=B.acct().orders.slice().sort(function(a,b){return a.time<b.time?1:-1;});
  var counts={all:orders.length,pending:0,processing:0,complete:0};
  orders.forEach(function(o){counts[o.invoice]++;});
  document.querySelectorAll('.record-tab').forEach(function(tab){var k=tab.dataset.filter;tab.textContent=({all:'全部',pending:'待开票',processing:'开票中',complete:'已开票'})[k]+' ('+counts[k]+')';});
  var rows=orders.filter(function(o){return invoiceFilter==='all'||o.invoice===invoiceFilter;});
  var pages=Math.max(1,Math.ceil(rows.length/RC_SIZE)); rcPage=Math.min(Math.max(1,rcPage),pages);
  document.getElementById('rechargeRecords').innerHTML=rows.slice((rcPage-1)*RC_SIZE,rcPage*RC_SIZE).map(function(o){
    return '<tr><td class="id-cell">'+B.esc(o.orderNo)+'</td><td>'+o.time+'</td><td><span class="mem">'+B.esc(o.who)+'</span></td><td><span class="bp-type '+o.type+'">'+(o.type==='recharge'?TYPE.recharge:B.esc(o.title))+'</span></td>'+
      '<td class="amount-cell">'+B.money(o.paid)+'</td><td>'+B.fmt(o.base+o.gift)+'</td><td>'+(o.gift?B.fmt(o.gift):'—')+'</td><td>'+(o.expireAt||'长期有效')+'</td><td>'+B.esc(o.channel)+'</td>'+
      '<td><span class="status-badge '+INV[o.invoice][1]+'">'+INV[o.invoice][0]+'</span></td></tr>';
  }).join('');
  document.getElementById('recordCount').textContent='共 '+rows.length+' 条记录';
  document.getElementById('recordEmpty').classList.toggle('hide',rows.length!==0);
  document.getElementById('rcCur').textContent=rcPage;
  document.getElementById('rcPrev').disabled=rcPage<=1; document.getElementById('rcNext').disabled=rcPage>=pages;
}
document.getElementById('rcPrev').onclick=function(){rcPage--;renderRecords();};
document.getElementById('rcNext').onclick=function(){rcPage++;renderRecords();};
document.querySelectorAll('.record-tab').forEach(function(tab){tab.addEventListener('click',function(){invoiceFilter=tab.dataset.filter;rcPage=1;document.querySelectorAll('.record-tab').forEach(function(t){t.classList.toggle('active',t===tab);});renderRecords();});});
function renderAll(){renderCompose();renderPlans();renderRecords();}
renderAll();renderSmall();
document.addEventListener('beanplan:change',renderAll);
})();
</script></body></html>
