<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>岗位权限 - 用户端</title><link href="../styles.css" rel="stylesheet"/><style>body{background:#f6f8fc}.main-content{padding:28px 32px}.head{padding:24px 27px;border:1px solid #d9e6fa;border-radius:16px;background:linear-gradient(115deg,#fff,#eff6ff);margin-bottom:18px}.head h2{margin:9px 0 0;color:#172b4d}.head p{margin:6px 0 0;color:#708199;font-size:13px}.form{max-width:900px;border:1px solid #e6ecf5;border-radius:14px;background:#fff;padding:24px 28px}.field{margin-bottom:19px}.field label{display:block;margin-bottom:7px;color:#42536c;font-size:13px}.field input{width:100%;height:42px;padding:0 11px;border:1px solid #d9e4f2;border-radius:8px;font-size:14px}.permission{border-top:1px solid #edf1f6;padding-top:20px}.permission h3{margin:0 0 12px;font-size:15px;color:#172b4d}.matrix{width:100%;border-collapse:collapse;font-size:13px}.matrix th,.matrix td{padding:11px 10px;border-bottom:1px solid #edf1f6;text-align:left}.matrix th{color:#8291a6;font-size:11px}.matrix input{width:16px;height:16px;vertical-align:middle}.hint{margin-top:10px;color:#8291a6;font-size:12px;line-height:1.65}.actions{display:flex;gap:10px;margin-top:24px;padding-top:20px;border-top:1px solid #edf1f6}@media(max-width:650px){.main-content{padding:18px 16px}.form{padding:20px 16px}.matrix{min-width:640px}.permission{overflow-x:auto}.actions{flex-direction:column}.actions .btn{justify-content:center}}</style></head><body><header class="top-bar user"><div class="top-bar-left"><a class="top-bar-logo" href="../index.html"><img alt="彩翼高科" class="logo-img" src="../logo.dc57457c.png"/></a><span class="top-bar-title">彩翼公共采购智能体协同管理平台</span></div></header><main class="main-content"><div class="head"><a href="role-list.html" style="color:#2563eb;text-decoration:none;font-size:13px">← 返回岗位管理</a><h2>岗位权限配置</h2><p>为岗位选择可见菜单及可执行操作。</p></div><form class="form" onsubmit="save(event)"><div class="field"><label>岗位名称 <b style="color:#ef4444">*</b></label><input id="roleName" value="采购专员" required/></div><div class="field"><label>岗位说明</label><input value="负责智能体使用与采购业务操作"/></div><section class="permission"><h3>菜单与操作权限</h3><table class="matrix"><thead><tr><th>功能菜单</th><th>查看</th><th>新增 / 编辑</th><th>审核 / 确认</th><th>导出</th><th>账号与岗位管理</th></tr></thead><tbody><tr><td>概览</td><td><input checked type="checkbox"/></td><td>—</td><td>—</td><td>—</td><td>—</td></tr><tr><td>智能体市场</td><td><input checked type="checkbox"/></td><td><input checked type="checkbox"/></td><td>—</td><td>—</td><td>—</td></tr><tr><td>账户与消费</td><td><input checked type="checkbox"/></td><td>—</td><td>—</td><td><input type="checkbox"/></td><td>—</td></tr><tr><td>发票管理</td><td><input type="checkbox"/></td><td><input type="checkbox"/></td><td>—</td><td>—</td><td>—</td></tr><tr><td>成员与岗位</td><td><input type="checkbox"/></td><td><input type="checkbox"/></td><td>—</td><td>—</td><td><input type="checkbox"/></td></tr></tbody></table><p class="hint">拥有“账号与岗位管理”权限的岗位，可管理普通子账号与岗位；正式系统还需服务端校验，不能仅依赖菜单隐藏。</p></section><div class="actions"><button class="btn btn-primary" type="submit">保存岗位权限</button><a class="btn btn-outline" href="role-list.html">取消</a></div></form></main><script>function save(e){e.preventDefault();alert('岗位权限已保存（静态原型演示）')}</script></body></html>
