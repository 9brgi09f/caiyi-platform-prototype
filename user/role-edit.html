<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>岗位配置 - 用户端</title><link href="../styles.css" rel="stylesheet"/><style>
:root{--ap-ink:#172b4d;--ap-blue:#2563eb;--ap-canvas:#f6f8fc;--ap-line:#e6ecf5;--ap-muted:#708199}.main-content{background:var(--ap-canvas);padding:28px 32px 44px}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;padding:24px 27px;border:1px solid #1d4ed8;border-radius:16px;background:linear-gradient(135deg,#2563EB,#1D4ED8)}.page-head h2{margin:0;color:#fff;font-size:24px}.page-head p{margin:6px 0 0;color:rgba(255,255,255,.86);font-size:13px}.back{display:inline-block;margin-bottom:9px;color:rgba(255,255,255,.92);font-size:13px;text-decoration:none}.shell,.detail-card{border:1px solid var(--ap-line);border-radius:14px;background:#fff}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:17px 19px;border-bottom:1px solid var(--ap-line)}.toolbar h3{margin:0;color:var(--ap-ink);font-size:15px}.toolbar h3 span{margin-left:7px;color:#8291a6;font-size:12px;font-weight:500}.search{width:230px;padding:9px 12px;border:1px solid #dce6f4;border-radius:9px;background:#fafcff;font-size:12px}.table-wrap{overflow-x:auto}.data-table{width:100%;min-width:830px;border-collapse:collapse;font-size:13px}.data-table th{padding:12px 16px;color:#8291a6;font-size:11px;text-align:left}.data-table td{padding:14px 16px;border-top:1px solid #f0f3f8;color:#4d6078}.data-table tr:hover td{background:#fafcff}.name{color:var(--ap-ink);font-weight:650}.sub{margin-top:3px;color:#94a3b8;font-size:11px}.tag{display:inline-flex;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:650}.tag.main{background:#eff4ff;color:#2563eb}.tag.active{background:#ecfdf5;color:#047857}.tag.pending{background:#fff8e7;color:#b7791f}.tag.off{background:#f1f5f9;color:#64748b}.roles{display:flex;flex-wrap:wrap;gap:5px}.roles span{padding:3px 7px;border-radius:6px;background:#f2f6fc;color:#4d6078;font-size:11px}.actions{display:flex;flex-wrap:wrap;gap:6px}.empty{display:none;padding:36px;text-align:center;color:#94a3b8}.detail-card{width:100%;max-width:none;padding:0}.detail-section{padding:22px 25px;border-top:1px solid var(--ap-line)}.detail-section:first-child{border-top:0}.detail-section h3{margin:0 0 15px;color:var(--ap-ink);font-size:15px}.detail-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.label{display:block;margin-bottom:4px;color:#94a3b8;font-size:11px}.value{color:#42536c;font-size:13px}.form-card{width:100%;max-width:none;padding:24px 27px}.form-section{padding-top:20px;margin-top:20px;border-top:1px solid var(--ap-line)}.form-section:first-child{padding-top:0;margin-top:0;border-top:0}.form-section h3{margin:0 0 14px;color:var(--ap-ink);font-size:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field label{display:block;margin-bottom:6px;color:#42536c;font-size:13px}.required{color:#ef4444;font-weight:700}.field input,.field select{width:100%;height:42px;padding:0 11px;border:1px solid #d9e4f2;border-radius:8px;background:#fff;font-size:14px}.field input:focus,.field select:focus{outline:0;border-color:#2563eb;box-shadow:0 0 0 3px #eff4ff}.hint{margin-top:6px;color:#8291a6;font-size:12px}.form-actions{display:flex;gap:10px;margin-top:25px;padding-top:20px;border-top:1px solid var(--ap-line)}.matrix{width:100%;border-collapse:collapse;font-size:13px}.matrix th,.matrix td{padding:11px 10px;border-bottom:1px solid #edf1f6;text-align:left}.matrix th{color:#8291a6;font-size:11px}.matrix input{width:16px;height:16px;vertical-align:middle}.timeline{display:grid;gap:0}.event{display:grid;grid-template-columns:130px 1fr;gap:16px;padding:13px 0;border-top:1px solid #edf1f6}.event:first-child{border-top:0}.event time{color:#94a3b8;font-size:12px}.event p{margin:0;color:#42536c;font-size:13px}.sidebar-link .icon svg{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}@media(max-width:700px){.main-content{padding:18px 16px 32px}.page-head{align-items:flex-start;flex-direction:column;padding:21px 20px}.page-head .btn{width:100%}.toolbar{align-items:flex-start;flex-direction:column}.search{width:100%}.detail-grid,.grid{grid-template-columns:1fr}.form-actions{flex-direction:column}.form-actions .btn{justify-content:center}.matrix{min-width:630px}.matrix-wrap{overflow-x:auto}.event{grid-template-columns:1fr;gap:4px}}
.role-toast{position:fixed;top:22px;right:24px;z-index:1001;display:flex;align-items:flex-start;gap:10px;max-width:360px;padding:13px 16px;border:1px solid #bbf7d0;border-radius:12px;background:#fff;box-shadow:0 12px 32px rgba(15,23,42,.13);opacity:0;pointer-events:none;transform:translateY(-12px);transition:opacity .2s ease,transform .2s ease}.role-toast.is-visible{opacity:1;transform:translateY(0)}.role-toast-icon{display:flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:#dcfce7;color:#15803d;font-size:12px;font-weight:800}.role-toast strong{display:block;color:var(--ap-ink);font-size:13px}.role-toast span{display:block;margin-top:1px;color:#708199;font-size:12px}@media(max-width:700px){.role-toast{top:14px;right:14px;left:14px;max-width:none}}</style></head><body><header class="top-bar user"><div class="top-bar-left"><a class="top-bar-logo" href="../index.html"><img alt="彩翼高科" class="logo-img" src="../logo.dc57457c.png"/></a><span class="top-bar-title">彩翼公共采购智能体协同管理平台</span></div><div class="top-bar-right"><div class="top-bar-user"><div class="top-bar-avatar">李</div><span>广州某某科技有限公司</span></div></div></header><aside class="sidebar user"><div class="sidebar-section"><a class="sidebar-link " href="index.html"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4v9Zm0 7h6v-4H4v4Zm10 0h6v-9h-6v9Zm0-16v4h6V4h-6Z"/></svg></span><span>概览</span></a><a class="sidebar-link " href="agent-list.html"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 10h8M8 14h5"/></svg></span><span>智能体市场</span></a><a class="sidebar-link " href="recharge-list.html"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18M16 14h2"/></svg></span><span>账户充值</span></a><a class="sidebar-link " href="balance.html"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true">< tr><td>概览</td><td><input data-perm="overview-view" type="checkbox"/></td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td></tr><tr><td>智能体市场</td><td><input data-perm="market-view" type="checkbox"/></td><td><input data-perm="market-edit" type="checkbox"/></td><td>—</td><td>—</td><td>—</td><td>—</td></tr><tr><td>账户与消费</td><td><input data-perm="account-view" type="checkbox"/></td><td>—</td><td>—</td><td><input data-perm="account-export" type="checkbox"/></td><td>—</td><td>—</td></tr><tr><td>发票管理</td><td><input data-perm="invoice-view" type="checkbox"/></td><td><input data-perm="invoice-edit" type="checkbox"/></td><td>—</td><td>—</td><td>—</td><td>—</td></tr><tr><td>账号与岗位</td><td><input data-perm="org-view" type="checkbox"/></td><td><input data-perm="org-edit" type="checkbox"/></td><td>—</td><td>—</td><td><input data-perm="org-account" type="checkbox"/></td><td><input data-perm="org-role" type="checkbox"/></td></tr></tbody></table></div></section><div class="form-actions"><button class="btn btn-primary" type="submit">保存岗位</button><a class="btn btn-outline" href="role-list.html">取消</a></div></form></main><div class="role-toast" id="roleToast" role="status" aria-live="polite"><div class="role-toast-icon">✓</div><div><strong id="roleToastTitle">岗位已保存</strong><span>岗位信息和权限配置已更新。</span></div></div><script>var roleData={admin:{name:"示例岗位 A",desc:"负责机构账号、岗位与权限管理",perms:["overview-view","market-view","org-view","org-edit","org-account","org-role"]},operator:{name:"示例岗位 B",desc:"负责智能体使用与日常业务操作",perms:["overview-view","market-view","market-edit","account-view"]},finance:{name:"示例岗位 C",desc:"负责账户充值、消费对账与发票管理",perms:["overview-view","account-view","account-export","invoice-view","invoice-edit"]},buyer:{name:"示例岗位 E",desc:"负责智能体使用与采购业务操作",perms:["overview-view","market-view","market-edit","account-view"]}};var roleKey=new URLSearchParams(location.search).get("role");var editRole=roleKey&&roleData[roleKey]?roleData[roleKey]:null;(function(){var t=editRole?"编辑岗位":"新增岗位";document.getElementById("pageTitle").textContent=t;document.title=t+" - 用户端";if(editRole){document.getElementById("roleName").value=editRole.name;document.getElementById("roleDesc").value=editRole.desc}document.querySelectorAll(".matrix input[type=checkbox]").forEach(function(c){c.checked=!!editRole&&editRole.perms.indexOf(c.getAttribute("data-perm"))>-1})})();function save(e){e.preventDefault();document.getElementById("roleToastTitle").textContent=editRole?"岗位已保存":"岗位已创建";var toast=document.getElementById('roleToast');toast.classList.add('is-visible');setTimeout(function(){location.href='role-list.html'},1000)}</script></body></html>
