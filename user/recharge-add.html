e,border-color .18s ease,box-shadow .18s ease}.payment-method:hover{border-color:#b8cafb!important;box-shadow:0 7px 17px rgba(37,74,164,.06);transform:translateY(-1px)}.payment-method.selected{border-color:#80a3fb!important;background:linear-gradient(120deg,#f0f5ff,#effdfb)!important;box-shadow:0 0 0 3px rgba(49,93,244,.09),0 8px 18px rgba(37,74,164,.07)}.payment-icon{display:flex;align-items:center;justify-content:center;flex:0 0 auto;width:34px!important;height:34px!important;border-radius:11px!important;font-size:15px!important;box-shadow:inset 0 1px rgba(255,255,255,.32)}.payment-name{color:#2b3952;font-size:14px;font-weight:750}.payment-note{display:block;margin-top:3px;color:#7c899e;font-size:12px}.manage-accounts{display:inline-flex;align-items:center;min-height:30px;margin:0;color:#315df4!important;font-size:13px;font-weight:750;text-decoration:none}.manage-accounts:after{margin-left:5px;content:"→"}.payment-total{display:flex;align-items:center;justify-content:space-between;margin-top:20px;padding:16px 18px;border:1px solid rgba(168,195,253,.45);border-radius:13px;background:linear-gradient(100deg,#f1f6ff,#f1fffc)}.payment-total span{color:#536780;font-size:14px;font-weight:750}.payment-total strong{color:#244cc8;font-size:25px;letter-spacing:-.05em}.pay-action{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-top:18px;padding:15px 18px 15px 22px;border:1px solid rgba(201,217,250,.9);border-radius:16px;background:rgba(255,255,255,.86);box-shadow:0 12px 26px rgba(38,55,100,.06);backdrop-filter:blur(10px)}.pay-tip{color:#6f8099;font-size:13px}.pay-action .btn-primary{min-width:178px!important;min-height:45px!important;border:0!important;border-radius:12px!important;background:linear-gradient(105deg,#315df4,#247eea 55%,#14aabd)!important;box-shadow:0 10px 19px rgba(43,93,226,.25)!important;font-weight:800!important;transition:transform .18s,box-shadow .18s!important}.pay-action .btn-primary:hover{box-shadow:0 13px 24px rgba(43,93,226,.31)!important;transform:translateY(-1px)}.bento-lite .sidebar.user .sidebar-link.active{position:relative;background:linear-gradient(90deg,#e7efff 0%,#f7fcff 100%)!important;box-shadow:none!important;color:#2f60d4!important}.bento-lite .sidebar-link.active::before{position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:linear-gradient(var(--blue),var(--cyan));content:""}.bento-lite .sidebar-link.active .icon{background:#d7e5ff!important;color:#2f60d4!important}
@media(max-width:900px){.bento-lite .main-content{padding:25px 17px 38px!important}.recharge-summary{grid-template-columns:1fr}.summary-item{border-right:0;border-bottom:1px solid #edf1f7}.summary-item:last-child{border-bottom:0}.payment-content{grid-template-columns:1fr}.pay-action{align-items:stretch;flex-direction:column}.pay-action .btn-primary{width:100%}}@media(max-width:560px){.bento-lite .main-content{padding:22px 15px 32px!important}.card-heading{align-items:flex-start}.bento-lite .page-header h2{font-size:25px!important}}

/* 蓝灰视觉统一：标题与强调元素使用单一蓝色体系，取消蓝绿／紫色渐变 */
:root{--cyan:#6f8fe9;--violet:#91a9ec;--mint:#5276d6;--canvas:#f6f8fc}
.bento-lite{background:#f6f8fc!important}
.main-content,.bento-lite .main-content{background:#f6f8fc!important}
.main-content:before,.bento-lite .main-content:before,.main-content:after,.bento-lite .main-content:after{display:none!important}
.page-head h2:before,.page-header h2:before,.bento-lite .page-header h2:before{background:#315df4!important}
.page-header:after{background:#315df4!important}
.account-overview:before,.confirmation-card:first-of-type:before{background:#315df4!important}
.option:before{background:#315df4!important}
.bento-lite .sidebar-link.active::before{background:#315df4!important}

.recharge-summary{background:linear-gradient(100deg,#fbfcff,#f5f8ff)!important}
.payment-group-title:before{background:#315df4!important}
.payment-method.selected{background:linear-gradient(120deg,#f0f5ff,#f6f8ff)!important}
.payment-total{background:linear-gradient(100deg,#f1f6ff,#f6f8ff)!important}
.pay-action .btn-primary{background:#315df4!important}


/* 详情页统一：使用文字返回与标题下方短横线。 */
.bento-lite .page-header{display:block!important}
.bento-lite .back-link{display:inline-block!important;min-height:0!important;margin:0 0 9px!important;padding:0!important;border:0!important;border-radius:0!important;background:transparent!important;color:#2563eb!important;font-size:13px!important;font-weight:600!important;line-height:1.4!important;transform:none!important}
.bento-lite .back-link:hover{border:0!important;background:transparent!important;color:#1d4ed8!important;transform:none!important}
.bento-lite .page-header h2:before{display:none!important}
.bento-lite .page-header h2::after{display:block!important;width:26px!important;height:6px!important;margin-top:10px!important;border-radius:999px!important;background:#315df4!important;content:""!important}

/* 接入第 3 版玻璃皮肤：环境光、侧栏、标题短杠、卡片与其余详情页统一（仅视觉，不影响内容） */
.bento-lite{background:radial-gradient(880px 620px at 56% 32%,rgba(126,164,255,.20),transparent 70%),radial-gradient(700px 520px at 12% 9%,rgba(123,147,255,.19),transparent 67%),radial-gradient(620px 560px at 94% 4%,rgba(146,219,255,.24),transparent 65%),radial-gradient(720px 520px at 30% 66%,rgba(146,219,255,.13),transparent 68%),radial-gradient(760px 620px at 61% 94%,rgba(216,190,255,.17),transparent 70%),linear-gradient(135deg,#f9fbff 0%,#f4f8ff 47%,#fbf9ff 100%)!important}

.bento-lite .sidebar.user .sidebar-link.active{background:rgba(255,255,255,.64)!important;color:var(--glass-blue-deep)!important;border:1px solid rgba(255,255,255,.88);box-shadow:6px 7px 16px rgba(84,110,168,.13),-5px -5px 12px rgba(255,255,255,.82),inset 0 1px 0 #fff!important}
.bento-lite .sidebar-link.active::before{display:none!important}

.recharge-summary{border:0!important;background:transparent!important;border-radius:0!important}

.pay-action .btn-primary{background:linear-gradient(145deg,#4f7dff,#356cf6)!important;box-shadow:0 8px 18px rgba(53,108,246,.26),inset 0 1px 0 rgba(255,255,255,.35)!important}

<main class="main-content"><div class="recharge-workbench"><div class="page-header"><a class="back-link" href="recharge-list.html">← 返回账户充值</a><h2>确认充值</h2></div><section class="confirmation-card" aria-label="充值信息"><div class="card-heading"><h3>充值信息</h3></div><div class="recharge-summary"><div class="summary-item"><span class="summary-label">充值金额</span><strong class="summary-value accent" id="rcPay">¥100.00</strong></div><div class="summary-item"><span class="summary-label">当前单位彩豆</span><strong class="summary-value" id="rcBefore">18,700 彩豆</strong></div><div class="summary-item"><span class="summary-label">充值后单位彩豆</span><strong class="summary-value accent" id="rcAfter">18,800 彩豆</strong></div></div></section><section class="confirmation-card" aria-label="付款方式"><div class="card-heading"><h3>付款方式</h3><a class="manage-accounts" href="payment-accounts.html">管理付款账户</a></div><div class="payment-content"><div><div class="payment-group-title">个人支付</div><div class="payment-options"><button type="button" class="payment-method selected" onclick="selectPay(this)"><span class="payment-icon" style="background:#07c160;color:#fff;">微</span><span><span class="payment-name">微信支付</span><span class="payment-note">推荐使用</span></span></button><button type="button" class="payment-method" onclick="selectPay(this)"><span class="payment-icon" style="background:#1677ff;color:#fff;">支</span><span><span class="payment-name">支付宝</span></span></button><button type="button" class="payment-method" onclick="selectPay(this)"><span class="payment-icon" style="background:#c0392b;color:#fff;">银</span><span><span class="payment-name">招商银行 尾号 3333</span><span class="payment-note">个人储蓄卡</span></span></button></div></div><div><div class="payment-group-title">企业支付</div><div class="payment-options"><button type="button" class="payment-method" onclick="selectPay(this)"><span class="payment-icon" style="background:#c0392b;color:#fff;">银</span><span><span class="payment-name">招商银行 尾号 8888</span><span class="payment-note">对公主账户 · 默认</span></span></button><button type="button" class="payment-method" onclick="selectPay(this)"><span class="payment-icon" style="background:#e67e22;color:#fff;">银</span><span><span class="payment-name">工商银行 尾号 6666</span><span class="payment-note">对公子账户</span></span></button></div></div></div><div class="payment-total"><span>应付金额</span><strong id="paymentTotal">¥100.00</strong></div></section><div class="pay-action"><span class="pay-tip">确认支付后，彩豆即时到账。</span><button class="btn btn-primary" onclick="confirmPay()">确认支付</button></div></div></main>
<script>
function selectPay(el){document.querySelectorAll('.payment-method').forEach(function(m){m.classList.remove('selected');});el.classList.add('selected');}
function getParam(k){var m=new RegExp('[?&]'+k+'=([^&]*)').exec(location.search);return m?decodeURIComponent(m[1]):null;}
function initOrder(){var amount=parseFloat(getParam('amount')||'100');var beans=parseInt(getParam('beans')||Math.round(amount),10);var bonus=parseInt(getParam('bonus')||'0',10);var before=18700;var beforeText=before.toLocaleString()+' 彩豆';var afterText=(before+beans+bonus).toLocaleString()+' 彩豆';var payText='¥'+amount.toFixed(2);document.getElementById('rcBefore').textContent=beforeText;document.getElementById('rcAfter').textContent=afterText;document.getElementById('rcPay').textContent=payText;document.getElementById('paymentTotal').textContent=payText;}
function confirmPay(){alert('本次充值 '+document.getElementById('rcPay').textContent+' 已完成模拟支付，彩豆已入企业账户。');window.location.href='recharge-list.html';}
document.addEventListener('DOMContentLoaded',initOrder);
</script></body>
