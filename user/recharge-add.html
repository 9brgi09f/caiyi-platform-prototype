<script>
(function(){
var B=window.BeanPlan, type=B.param('type')||'recharge', tier=B.param('tier'), planId=B.param('plan'), info=document.getElementById('raInfo'), order=null;
var personal=B.isPersonal(), wallet=B.walletName(), b=B.buckets();
if(personal){document.querySelectorAll('.bp-org-pay').forEach(function(el){el.style.display='none';});document.querySelector('.payment-content').style.gridTemplateColumns='1fr';}
function row(k,v,x,hl){return '<div class="bp-calc-row'+(hl?' hl':'')+'"><span class="k">'+k+'</span><span class="v">'+v+'</span><span class="x">'+(x||'')+'</span></div>';}
function fail(msg){info.innerHTML='<div class="bp-warnbox">'+msg+'</div>';document.getElementById('payBtn').disabled=true;document.getElementById('paymentTotal').textContent='—';}
function build(){
  var cfg=B.loadCfg();
  if(type==='recharge'){
    var amt=Number(B.param('amount'));
    if(!(amt>=cfg.customMin&&amt<=cfg.customMax)) return fail('充值金额无效，请返回重新选择。');
    var gift=B.rechargeGiftOf(amt,cfg), promo=B.rechargePromo(cfg);
    order={pay:amt};
    document.getElementById('raTitle').textContent='确认充值';
    document.getElementById('agreeWrap').style.display='none';
    info.innerHTML='<div class="bp-calc">'+row('订单类型','单次充值')+row('到账彩豆',B.fmt(amt+gift)+' 彩豆',gift?'充值 '+B.fmtInt(amt)+' + 赠送 '+B.fmtInt(gift)+'（限时 '+promo.ratio+'%，'+promo.end+' 截止）':'不赠送，长期有效')+row('有效期','长期有效')+row('当前'+wallet,B.fmt(b.total)+' 彩豆')+row('充值后'+wallet,B.fmt(b.total+amt+gift)+' 彩豆','',true)+'</div>'+
      '<p class="bp-note" style="margin:10px 2px 0">按实付金额 '+B.money(amt,0)+' 开票'+(gift?'，赠送彩豆不开票':'')+'。赠送按支付成功时的活动规则计算。</p>';
  } else if(type==='plan'){
    var p=B.planDef(tier,cfg);
    if(!p||!p.on) return fail('该年包暂不可购买，请返回重新选择。');
    order={pay:p.price};
    document.getElementById('raTitle').textContent='购买年包';
    var d=new Date(B.TODAY);d.setMonth(d.getMonth()+cfg.validityMonths);d.setDate(d.getDate()-1);
    var exp=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    info.innerHTML='<div class="bp-calc">'+row('年包',p.name)+row('年度总彩豆',B.fmtInt(p.total)+' 彩豆','基础 '+B.fmtInt(p.base)+' + 赠送 '+B.fmtInt(p.gift)+'（'+p.ratio+'%）')+
      row('有效期',B.TODAY+' 至 '+exp,cfg.validityMonths+' 个月，到期未使用部分清零')+row('当前'+wallet,B.fmt(b.total)+' 彩豆')+row('购买后'+wallet,B.fmt(b.total+p.total)+' 彩豆','',true)+'</div>'+
      '<p class="bp-note" style="margin:10px 2px 0">按实付金额 '+B.money(p.price,0)+' 开票，赠送彩豆不开票。</p>';
  } else if(type==='upgrade'){
    var plan=B.activePlans().filter(function(x){return x.id===planId;})[0];
    if(!plan) return fail('年包不存在或已到期，请返回重新选择。');
    var targets=B.upgradeTargets(plan,cfg);
    if(!targets.length) return fail('当前年包已是最高档位，暂无可升级的年包。');
    if(!targets.some(function(t){return t.to.tier===tier;})) tier=targets[0].to.tier;
    document.getElementById('raTitle').textContent='升级年包';
    var c=targets.filter(function(t){return t.to.tier===tier;})[0];
    order={pay:c.pay};
    var ratioUp=c.to.ratio-c.from.ratio;
    info.innerHTML='<div class="bp-from"><span>当前年包</span><b>'+B.esc(c.from.name)+'</b><em>已付 '+B.money(c.from.paid,0)+' · '+B.fmtInt(c.from.total)+' 彩豆 · 剩余 '+B.fmt(c.from.remaining)+' · '+c.from.expireAt+' 到期</em></div>'+
      '<div class="bp-pick-title" id="pickTitle">升级为</div><div class="bp-pick" role="radiogroup" aria-labelledby="pickTitle">'+targets.map(function(t){
        var on=t.to.tier===tier;
        return '<button type="button" class="bp-pick-item'+(on?' on':'')+'" role="radio" aria-checked="'+on+'" data-tier="'+t.to.tier+'"><b>'+B.esc(t.to.name)+'</b><span>'+B.money(t.to.price,0)+' · '+B.fmtInt(t.to.total)+' 彩豆</span><em>补 '+B.money(t.pay,0)+' · 补发 '+B.fmtInt(t.beans)+' 彩豆</em></button>';
      }).join('')+'</div>'+
      '<div class="bp-calc">'+row('补差价',B.money(c.pay,0),B.money(c.to.price,0)+' − 已付 '+B.money(c.from.paid,0),true)+
      row('补发彩豆',B.fmtInt(c.beans)+' 彩豆',B.fmtInt(c.to.total)+' − 原年包 '+B.fmtInt(c.from.total))+
      row('其中基础彩豆',B.fmtInt(c.baseAdd),'等于补差价')+
      row('其中赠送彩豆',B.fmtInt(c.giftAdd),'补差价 × '+c.to.ratio+'% = '+B.fmtInt(c.giftOnNew)+(c.giftCatchup?'；原基础彩豆赠送比例 '+(ratioUp>=0?'+':'')+ratioUp+'% = '+B.fmtInt(c.giftCatchup):''))+
      row('升级后年包剩余',B.fmt(c.remainingAfter)+' 彩豆',B.fmt(c.from.remaining)+' + '+B.fmtInt(c.beans))+
      row('有效期','不变，'+c.expireAt+' 到期')+'</div>'+
      (c.daysLeft<90?'<div class="bp-warnbox">当前年包剩余 '+c.daysLeft+' 天到期，补发彩豆须在 '+c.expireAt+' 前用完。如需完整 '+cfg.validityMonths+' 个月，可<a class="bp-link" href="recharge-add.html?type=plan&tier='+tier+'">单独购买'+B.esc(c.to.name)+'</a>。</div>':'')+
      '<p class="bp-note" style="margin:10px 2px 0">按补差价 '+B.money(c.pay,0)+' 开票，赠送彩豆不开票。</p>';
    info.querySelectorAll('.bp-pick-item').forEach(function(btn){btn.addEventListener('click',function(){
      tier=btn.dataset.tier;
      var u=new URL(location.href);u.searchParams.set('tier',tier);history.replaceState(null,'',u.toString());
      build();
      var cur=info.querySelector('.bp-pick-item.on'); if(cur) cur.focus();
    });});
  } else return fail('订单类型无效，请返回重新选择。');
  document.getElementById('paymentTotal').textContent=B.money(order.pay);
}
build();
document.querySelectorAll('.payment-method').forEach(function(m){m.addEventListener('click',function(){document.querySelectorAll('.payment-method').forEach(function(x){x.classList.remove('selected');});m.classList.add('selected');});});
document.getElementById('payBtn').addEventListener('click',function(){
  var err=document.getElementById('payErr'); err.hidden=true;
  if(!order) return;
  if(type!=='recharge'&&!document.getElementById('agree').checked){err.hidden=false;err.textContent='请先阅读并同意《彩豆规则》';return;}
  var ch=document.querySelector('.payment-method.selected').dataset.channel;
  var o=type==='recharge'?B.createRecharge(order.pay,ch):type==='plan'?B.createPlan(tier,ch):B.createUpgrade(planId,tier,ch);
  if(!o){err.hidden=false;err.textContent='支付结果保存失败，请重试。';return;}
  location.href='recharge-result.html?order='+encodeURIComponent(o.orderNo);
});
})();
</script></body>
</html>
