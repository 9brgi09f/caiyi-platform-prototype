<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>岗位管理 - 用户端</title><link href="../styles.css" rel="stylesheet"/><style>body{background:#f6f8fc}.main-content{padding:28px 32px}.head{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:18px;padding:24px 27px;border:1px solid #d9e6fa;border-radius:16px;background:linear-gradient(115deg,#fff,#eff6ff)}.head h2{margin:0;color:#172b4d}.head p{margin:6px 0 0;color:#708199;font-size:13px}.tip{margin-bottom:17px;padding:12px 14px;border:1px solid #d7e6fd;border-radius:10px;background:#f5f9ff;color:#315889;font-size:12px;line-height:1.7}.shell{border:1px solid #e6ecf5;border-radius:14px;background:#fff}.table{width:100%;border-collapse:collapse;font-size:13px}.table th{padding:12px 17px;color:#8291a6;text-align:left;font-size:11px}.table td{padding:15px 17px;border-top:1px solid #f0f3f8;color:#4d6078}.table tr:hover td{background:#fafcff}.title{color:#172b4d;font-weight:650}.tag{padding:3px 8px;border-radius:999px;background:#eff4ff;color:#2563eb;font-size:11px;font-weight:650}.tag.custom{background:#f3f4f6;color:#58687c}.actions .btn{margin-right:5px}@media(max-width:650px){.main-content{padding:18px 16px}.head{align-items:flex-start;flex-direction:column}.head .btn{width:100%}.shell{overflow-x:auto}.table{min-width:700px}}</style></head><body><header class="top-bar user"><div class="top-bar-left"><a class="top-bar-logo" href="../index.html"><img alt="彩翼高科" class="logo-img" src="../logo.dc57457c.png"/></a><span class="top-bar-title">彩翼公共采购智能体协同管理平台</span></div></header><main class="main-content"><div class="head"><div><a href="member-list.html" style="color:#2563eb;text-decoration:none;font-size:13px">← 返回成员与岗位</a><h2 style="margin-top:9px">岗位管理</h2><p>按岗位统一配置机构菜单与操作权限。</p></div><a class="btn btn-primary" href="role-edit.html">+ 新增岗位</a></div><div class="tip"><b>授权边界：</b>主账号默认拥有全部权限。拥有账号与岗位管理权限的账号可维护普通岗位，但不能修改主账号或授予超过自身的权限。</div><section class="shell"><table class="table"><thead><tr><th>岗位名称</th><th>类型</th><th>成员数</th><th>权限摘要</th><th>状态</th><th>操作</th></tr></thead><tbody><tr><td class="title">机构管理员</td><td><span class="tag">内置岗位</span></td><td>1</td><td>成员与岗位、智能体市场、消费记录</td><td>启用</td><td class="actions"><a class="btn btn-sm btn-outline" href="role-edit.html?role=admin">查看权限</a></td></tr><tr><td class="title">业务操作员</td><td><span class="tag">内置岗位</span></td><td>1</td><td>智能体市场、调用、消费记录</td><td>启用</td><td class="actions"><a class="btn btn-sm btn-outline" href="role-edit.html?role=operator">查看权限</a></td></tr><tr><td class="title">财务专员</td><td><span class="tag">内置岗位</span></td><td>1</td><td>账户充值、消费记录、发票管理</td><td>启用</td><td class="actions"><a class="btn btn-sm btn-outline" href="role-edit.html?role=finance">查看权限</a></td></tr><tr><td class="title">采购专员</td><td><span class="tag custom">自定义岗位</span></td><td>0</td><td>智能体市场、调用、消费记录查看</td><td>启用</td><td class="actions"><a class="btn btn-sm btn-outline" href="role-edit.html?role=buyer">编辑</a><button class="btn btn-sm btn-outline" onclick="alert('停用岗位前，请先为成员重新分配岗位')">停用</button></td></tr></tbody></table></section></main></body></html>
