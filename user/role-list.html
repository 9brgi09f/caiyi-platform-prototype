<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>岗位管理 - 用户端</title><link href="../styles.css" rel="stylesheet"/><style>
:root{--ap-ink:#172b4d;--ap-blue:#2563eb;--ap-canvas:#f6f8fc;--ap-line:#e6ecf5;--ap-muted:#708199}.main-content{background:var(--ap-canvas);padding:28px 32px 44px}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;padding:24px 27px;border:1px solid #1d4ed8;border-radius:16px;background:linear-gradient(135deg,#2563EB,#1D4ED8)}.page-head h2{margin:0;color:#fff;font-size:24px}.page-head p{margin:6px 0 0;color:rgba(255,255,255,.86);font-size:13px}.back{display:inline-block;margin-bottom:9px;color:rgba(255,255,255,.92);font-size:13px;text-decoration:none}.shell,.detail-card{border:1px solid var(--ap-line);border-radius:14px;background:#fff}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:17px 19px;border-bottom:1px solid var(--ap-line)}.toolbar h3{margin:0;color:var(--ap-ink);font-size:15px}.toolbar h3 span{margin-left:7px;color:#64748b;font-size:13px;font-weight:500}.search{width:230px;padding:9px 12px;border:1px solid #dce6f4;border-radius:9px;background:#fafcff;font-size:12px}.table-wrap{overflow-x:auto}.data-table{width:100%;min-width:830px;border-collapse:collapse;font-size:14px}.data-table th{padding:13px 16px;color:#64748b;font-size:12px;font-weight:600;text-align:left}.data-table td{padding:15px 16px;border-top:1px solid #f0f3f8;color:#4d6078}.data-table tr:hover td{background:#fafcff}.name{color:var(--ap-ink);font-weight:650}.sub{margin-top:4px;color:#708199;font-size:12px}.tag{display:inline-flex;align-items:center;min-height:26px;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:650;line-height:1}.tag.main{background:#eff4ff;color:#2563eb}.tag.active{background:#ecfdf5;color:#047857}.tag.pending{background:#fff8e7;color:#b7791f}.tag.off{background:#f1f5f9;color:#64748b}.roles{display:flex;flex-wrap:wrap;gap:5px}.roles span{padding:4px 8px;border-radius:6px;background:#f2f6fc;color:#4d6078;font-size:12px;line-height:1.2}.actions{display:flex;flex-wrap:wrap;gap:8px}.data-table .btn{min-height:32px;padding:6px 10px;font-size:12px}.data-table td:nth-child(3){line-height:1.65}.empty{display:none;padding:36px;text-align:center;color:#94a3b8}.detail-card{max-width:900px;padding:0}.detail-section{padding:22px 25px;border-top:1px solid var(--ap-line)}.detail-section:first-child{border-top:0}.detail-section h3{margin:0 0 15px;color:var(--ap-ink);font-size:15px}.detail-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.label{display:block;margin-bottom:4px;color:#94a3b8;font-size:11px}.value{color:#42536c;font-size:13px}.form-card{max-width:900px;padding:24px 27px}.form-section{padding-top:20px;margin-top:20px;border-top:1px solid var(--ap-line)}.form-section:first-child{padding-top:0;margin-top:0;border-top:0}.form-section h3{margin:0 0 14px;color:var(--ap-ink);font-size:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field label{display:block;margin-bottom:6px;color:#42536c;font-size:13px}.field input,.field select{width:100%;height:42px;padding:0 11px;border:1px solid #d9e4f2;border-radius:8px;background:#fff;font-size:14px}.field input:focus,.field select:focus{outline:0;border-color:#2563eb;box-shadow:0 0 0 3px #eff4ff}.hint{margin-top:6px;color:#8291a6;font-size:12px}.form-actions{display:flex;gap:10px;margin-top:25px;padding-top:20px;border-top:1px solid var(--ap-line)}.matrix{width:100%;border-collapse:collapse;font-size:13px}.matrix th,.matrix td{padding:11px 10px;border-bottom:1px solid #edf1f6;text-align:left}.matrix th{color:#8291a6;font-size:11px}.matrix input{width:16px;height:16px;vertical-align:middle}.timeline{display:grid;gap:0}.event{display:grid;grid-template-columns:130px 1fr;gap:16px;padding:13px 0;border-top:1px solid #edf1f6}.event:first-child{border-top:0}.event time{color:#94a3b8;font-size:12px}.event p{margin:0;color:#42536c;font-size:13px}.sidebar-link .icon svg{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}@media(max-width:700px){.main-content{padding:18px 16px 32px}.page-head{align-items:flex-start;flex-direction:column;padding:21px 20px}.page-head .btn{width:100%}.toolbar{align-items:flex-start;flex-direction:column}.search{width:100%}.detail-grid,.grid{grid-template-columns:1fr}.form-actions{flex-direction:column}.form-actions .btn{justify-content:center}.matrix{min-width:630px}.matrix-wrap{overflow-x:auto}.event{grid-template-columns:1fr;gap:4px}}
.toast{position:fixed;left:50%;top:76px;z-index:1100;transform:translateX(-50%);max-width:86vw;padding:10px 18px;border-radius:10px;background:#172b4d;color:#fff;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s}.toast.show{opacity:1}</style></head><body><header class="top-bar user"><div class="top-bar-left"><a class="top-bar-logo" href="../index.html"><img alt="彩翼高科" class="logo-img" src="../logo.dc57457c.png"/></a><span class="top-bar-title">彩翼公共采购智能体协同管理平台</span></div><div class="top-bar-right"><div class="top-bar-user"><div class="top-bar-avatar">李</div><span>广州某某科技有限公司</span></div></div></header><aside class="sidebar user"><div class="sidebar-section"><a class="sidebar-link " href="index.html"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4v9Zm0 7h6v-4H4v4Zm10 0h6v-9h-6v9Zm0-16v4h6V4h-6Z"/></svg></span><span>概览</span></a><a class="sidebar-link " href="agent-list.html"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 10h8M8 14h5"/></svg></span><span>智能体市场</span></a><a class="sidebar-link " href="recharge-list.html"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18M16 14h2"/></svg></span><span>账户充值</span></a><a class="sidebar-link " href="balance.html"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H18a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H6.5A2.5 2.5 0 0 1 4 17.5v-10Z"/><path d="M4 8h13M15 14h3"/></svg></span><span>余额管理</span></a><a class="sidebar-link " href="payment-accounts.html"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-6 9 6v9H3v-9Z"/><path d="M6 10v9m4-9v9m4-9v9m4-9v9M2 19h20"/></svg></span><span>付款账户</span></a><a class="sidebar-link " href="consumption-list.html"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10m7 10V4m7 16v-7"/></svg></span><span>消费记录</span></a><a class="sidebar-link " href="invoice-list.html"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l3 3v15l-3-2-3 2-3-2-3 2V3Z"/><path d="M9 9h6m-6 4h6"/></svg></span><span>发票管理</span></a><a class="sidebar-link " href="member-list.html"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3"/><path d="M5 20c.6-3.4 3-5 7-5s6.4 1.6 7 5"/></svg></span><span>账号管理</span></a><a class="sidebar-link active" href="role-list.html"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5c0 4.5 2.9 7.9 7 10 4.1-2.1 7-5.5 7-10V6l-7-3Z"/><path d="M9 12h6m-3-3v6"/></svg></span><span>岗位管理</span></a></div></aside><main class="main-content"><section class="page-head"><div><h2>岗位管理</h2></div><a class="btn btn-primary" href="role-edit.html">新增岗位</a></section><section class="shell"><div class="toolbar"><h3>岗位列表 <span>共 4 个</span></h3></div><div class="table-wrap"><table class="data-table"><thead><tr><th>岗位名称</th><th>关联账号</th><th>权限摘要</th><th>状态</th><th>操作</th></tr></thead><tbody><tr><td class="name">示例岗位 A</td><td>1</td><td>账号管理、岗位管理、智能体市场</td><td><span class="tag active">启用</span></td><td><div class="actions"><a class="btn btn-sm btn-outline" href="role-view.html?role=admin">查看</a><a class="btn btn-sm btn-outline" href="role-edit.html?role=admin">编辑</a><button class="btn btn-sm btn-outline" type="button" onclick="toggleRole(this,'示例岗位 A',1)">停用</button></div></td></tr><tr><td class="name">示例岗位 B</td><td>1</td><td>智能体市场、调用、消费记录</td><td><span class="tag active">启用</span></td><td><div class="actions"><a class="btn btn-sm btn-outline" href="role-view.html?role=operator">查看</a><a class="btn btn-sm btn-outline" href="role-edit.html?role=operator">编辑</a><button class="btn btn-sm btn-outline" type="button" onclick="toggleRole(this,'示例岗位 B',1)">停用</button></div></td></tr><tr><td class="name">示例岗位 C</td><td>1</td><td>账户充值、消费记录、发票管理</td><td><span class="tag active">启用</span></td><td><div class="actions"><a class="btn btn-sm btn-outline" href="role-view.html?role=finance">查看</a><a class="btn btn-sm btn-outline" href="role-edit.html?role=finance">编辑</a><button class="btn btn-sm btn-outline" type="button" onclick="toggleRole(this,'示例岗位 C',1)">停用</button></div></td></tr><tr><td class="name">示例岗位 E</td><td>0</td><td>智能体市场、调用、消费记录查看</td><td><span class="tag active">启用</span></td><td><div class="actions"><a class="btn btn-sm btn-outline" href="role-view.html?role=buyer">查看</a><a class="btn btn-sm btn-outline" href="role-edit.html?role=buyer">编辑</a><button class="btn btn-sm btn-outline" type="button" onclick="toggleRole(this,'示例岗位 E',0)">停用</button></div></td></tr></tbody></table></div></section></main><div class="modal-overlay" id="roleStatusModal"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="roleStatusTitle"><div class="modal-header"><span class="modal-title" id="roleStatusTitle">确认停用该岗位？</span><button class="modal-close" type="button" aria-label="关闭" onclick="closeRoleDialog()">×</button></div><div class="modal-body"><p id="roleStatusText" style="margin:0;color:#4d6078;font-size:14px;line-height:1.8"></p><p id="roleStatusSub" style="margin:8px 0 0;color:#8291a6;font-size:13px;line-height:1.8"></p></div><div class="modal-footer"><button class="btn btn-outline" type="button" onclick="closeRoleDialog()">取消</button><button class="btn btn-danger" id="roleStatusConfirm" type="button" onclick="confirmRoleAction()">确认停用</button></div></div></div><div class="toast" id="toast" role="status"></div><script>var pendingRoleAction=null;function toggleRole(button,name,linked){var row=button.closest('tr');var badge=row.querySelector('.tag.active,.tag.off');var isActive=badge.textContent.trim()==='启用';pendingRoleAction={button:button,badge:badge,isActive:isActive};document.getElementById('roleStatusTitle').textContent=isActive?'确认停用该岗位？':'确认启用该岗位？';document.getElementById('roleStatusText').innerHTML=(isActive?'停用后，'+linked+' 个关联账号将不再获得':'启用后，'+linked+' 个关联账号将恢复')+'<b style="color:#172b4d">“'+name+'”</b>的岗位权限。';document.getElementById('roleStatusSub').textContent=isActive?'岗位的权限配置会保留，重新启用后关联账号即恢复该岗位权限。':'启用后立即生效，可随时再次停用。';var btn=document.getElementById('roleStatusConfirm');btn.textContent=isActive?'确认停用':'确认启用';btn.className=isActive?'btn btn-danger':'btn btn-primary';document.getElementById('roleStatusModal').classList.add('active')}function closeRoleDialog(){document.getElementById('roleStatusModal').classList.remove('active');pendingRoleAction=null}function confirmRoleAction(){if(!pendingRoleAction)return;var a=pendingRoleAction;a.badge.textContent=a.isActive?'停用':'启用';a.badge.className=a.isActive?'tag off':'tag active';a.button.textContent=a.isActive?'启用':'停用';pendingRoleAction=null;document.getElementById('roleStatusModal').classList.remove('active');showToast(a.isActive?'岗位已停用，关联账号不再获得该岗位权限':'岗位已启用，关联账号已恢复该岗位权限')}function showToast(m){var el=document.getElementById('toast');el.textContent=m;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove('show')},2400)}document.getElementById('roleStatusModal').addEventListener('click',function(e){if(e.target===this)closeRoleDialog()});document.addEventListener('keydown',function(e){if(e.key==='Escape')closeRoleDialog()});</script></body></html>
