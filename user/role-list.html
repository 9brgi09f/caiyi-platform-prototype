olor:#94a3b8}.detail-card{max-width:900px;padding:0}.detail-section{padding:22px 25px;border-top:1px solid var(--ap-line)}.detail-section:first-child{border-top:0}.detail-section h3{margin:0 0 15px;color:var(--ap-ink);font-size:15px}.detail-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.label{display:block;margin-bottom:4px;color:#94a3b8;font-size:11px}.value{color:#42536c;font-size:13px}.form-card{max-width:900px;padding:24px 27px}.form-section{padding-top:20px;margin-top:20px;border-top:1px solid var(--ap-line)}.form-section:first-child{padding-top:0;margin-top:0;border-top:0}.form-section h3{margin:0 0 14px;color:var(--ap-ink);font-size:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field label{display:block;margin-bottom:6px;color:#42536c;font-size:13px}.field input,.field select{width:100%;height:42px;padding:0 11px;border:1px solid #d9e4f2;border-radius:8px;background:#fff;font-size:14px}.field input:focus,.field select:focus{outline:0;border-color:#2563eb;box-shadow:0 0 0 3px #eff4ff}.hint{margin-top:6px;color:#8291a6;font-size:12px}.form-actions{display:flex;gap:10px;margin-top:25px;padding-top:20px;border-top:1px solid var(--ap-line)}.matrix{width:100%;border-collapse:collapse;font-size:13px}.matrix th,.matrix td{padding:11px 10px;border-bottom:1px solid #edf1f6;text-align:left}.matrix th{color:#8291a6;font-size:11px}.matrix input{width:16px;height:16px;vertical-align:middle}.timeline{display:grid;gap:0}.event{display:grid;grid-template-columns:130px 1fr;gap:16px;padding:13px 0;border-top:1px solid #edf1f6}.event:first-child{border-top:0}.event time{color:#94a3b8;font-size:12px}.event p{margin:0;color:#42536c;font-size:13px}.sidebar-link .icon svg{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}@media(max-width:700px){.main-content{padding:18px 16px 32px}.page-head{align-items:flex-start;flex-direction:column;padding:21px 20px}.page-head .btn{width:100%}.toolbar{align-items:flex-start;flex-direction:column}.search{width:100%}.detail-grid,.grid{grid-template-columns:1fr}.form-actions{flex-direction:column}.form-actions .btn{justify-content:center}.matrix{min-width:630px}.matrix-wrap{overflow-x:auto}.event{grid-template-columns:1fr;gap:4px}}

idebar-link " href="member-list.html"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3"/><path d="M5 20c.6-3.4 3-5 7-5s6.4 1.6 7 5"/></svg></span><span>账号管理</span></a><a class="sidebar-link active" href="role-list.html"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5c0 4.5 2.9 7.9 7 10 4.1-2.1 7-5.5 7-10V6l-7-3Z"/><path d="M9 12h6m-3-3v6"/></svg></span><span>岗位管理</span></a></div></aside><main class="main-content"><section class="page-head"><div><h2>岗位管理</h2></div><a class="btn btn-primary" href="role-edit.html">新增岗位</a></section><section class="shell"><div class="toolbar"><h3>岗位列表 <span>共 4 个</span></h3></div><div class="table-wrap"><table class="data-table"><thead><tr><th>岗位名称</th><th>类型</th><th>关联账号</th><th>权限摘要</th><th>状态</th><th>操作</th></tr></thead><tbody><tr><td class="name">示例岗位 A</td><td><span class="tag main">机构自定义岗位</span></td><td>1</td><td>账号管理、岗位管理、智能体市场</td><td><span class="tag active">启用</span></td><td><a class="btn btn-sm btn-outline" href="role-view.html?role=admin">查看详情</a><a class="btn btn-sm btn-outline" href="role-edit.html?role=admin">编辑</a><button class="btn btn-sm btn-outline status-action" type="button" onclick="toggleRole(this,'示例岗位 A')">停用</button></td></tr><tr><td class="name">示例岗位 B</td><td><span class="tag main">机构自定义岗位</span></td><td>1</td><td>智能体市场、调用、消费记录</td><td><span class="tag active">启用</span></td><td><a class="btn btn-sm btn-outline" href="role-view.html?role=operator">查看详情</a><a class="btn btn-sm btn-outline" href="role-edit.html?role=operator">编辑</a><button class="btn btn-sm btn-outline status-action" type="button" onclick="toggleRole(this,'示例岗位 B')">停用</button></td></tr><tr><td class="name">示例岗位 C</td><td><span class="tag main">机构自定义岗位</span></td><td>1</td><td>账户充值、消费记录、发票管理</td><td><span class="tag active">启用</span></td><td><a class="btn btn-sm btn-outline" href="role-view.html?role=finance">查看详情</a><a class="btn btn-sm btn-outline" href="role-edit.html?role=finance">编辑</a><button class="btn btn-sm btn-outline status-action" type="button" onclick="toggleRole(this,'示例岗位 C')">停用</button></td></tr><tr><td class="name">示例岗位 E</td><td><span class="tag off">机构自定义岗位</span></td><td>0</td><td>智能体市场、调用、消费记录查看</td><td><span class="tag active">启用</span></td><td><a class="btn btn-sm btn-outline" href="role-view.html?role=buyer">查看详情</a><a class="btn btn-sm btn-outline" href="role-edit.html?role=example">编辑</a><button class="btn btn-sm btn-outline status-action" type="button" onclick="toggleRole(this,'示例岗位 E')">停用</button></td></tr></tbody></table></div></section></main><script>function toggleRole(button,name){var row=button.closest('tr');var badge=row.querySelector('td:nth-child(5) .tag');var isActive=badge.textContent.trim()==='启用';if(isActive){badge.textContent='停用';badge.className='tag off';button.textContent='启用';alert('“'+name+'”已停用；关联账号将不再获得该岗位权限。')}else{badge.textContent='启用';badge.className='tag active';button.textContent='停用';alert('“'+name+'”已启用；关联账号将恢复该岗位权限。')}}</script></body></html>
