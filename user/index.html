<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>用户端 - 彩翼智能体平台原型</title>
<link href="../styles.css" rel="stylesheet"/>
<script src="../app.js"></script>
<style>
        .page-header{background:linear-gradient(125deg,#fff 0%,#f2f7ff 100%);color:#172b4d;padding:24px 27px;border:1px solid #c9dcfb;border-radius:16px;margin-bottom:18px}
        .page-header h2{color:#172b4d;margin:0;font-size:24px}
        .page-header p{margin:7px 0 0;color:#708199;font-size:13px;opacity:1}
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--spacing-md); margin-bottom: var(--spacing-lg); }
        .stat-card { background: var(--card-bg); border: 1px solid var(--border-light); border-radius: var(--radius-lg); padding: var(--spacing-lg); text-align: center; }
        .stat-value { font-size: 24px; font-weight: 700; color: var(--user-color); }
        .stat-label { font-size: 13px; color: var(--text-muted); margin-top: var(--spacing-xs); }
    </style>

<style id="identity-switcher-css">
.id-switcher{position:relative;display:inline-flex;align-items:center;}
.id-trigger{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 6px;border-radius:8px;cursor:pointer;transition:background 0.15s;user-select:none;}
.id-trigger:hover{background:rgba(0,0,0,0.05);}
.id-avatar{width:32px;height:32px;border-radius:50%;background:#EFF4FF;color:#2563EB;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.id-info{display:flex;flex-direction:column;align-items:flex-start;line-height:1.3;}
.id-org{font-size:13px;font-weight:500;color:#1e293b;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.id-type-badge{font-size:10px;font-weight:600;padding:1px 7px;border-radius:10px;background:#EFF4FF;color:#2563EB;}
.id-chevron{font-size:10px;color:#94a3b8;margin-left:2px;transition:transform 0.2s;}
.id-switcher.open .id-chevron{transform:rotate(180deg);}
.id-menu{display:none;position:absolute;top:calc(100% + 6px);right:0;background:white;border:1px solid #dfe4ee;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,0.12);min-width:240px;z-index:999;overflow:hidden;}
.id-switcher.open .id-menu{display:block;}
.id-menu-hd{padding:10px 14px 8px;font-size:11px;font-weight:600;color:#94a3b8;letter-spacing:1px;border-bottom:1px solid #ecf0f6;}
.id-menu-item{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;transition:background 0.15s;text-decoration:none;color:inherit;}
.id-menu-item:hover{background:#F8FAFC;}
.id-menu-item.current{background:#F8FAFF;}
.id-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.id-dot.active{background:#2563EB;}
.id-dot.idle{background:#dfe4ee;}
.id-item-body{flex:1;}
.id-item-org{font-size:13px;font-weight:500;color:#1e293b;}
.id-item-type{font-size:11px;color:#94a3b8;margin-top:1px;}
.id-item-tag{font-size:10px;font-weight:600;padding:1px 7px;border-radius:10px;margin-left:auto;flex-shrink:0;}
.id-item-tag.current-tag{background:#EFF4FF;color:#2563EB;}
.id-menu-sep{height:1px;background:#ecf0f6;margin:4px 0;}
.id-menu-action{display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:12px;color:#64748b;cursor:pointer;transition:background 0.15s;text-decoration:none;}
.id-menu-action:hover{background:#F8FAFC;color:#2563EB;}
</style>
</head>
<body>
<header class="top-bar user">
<div class="top-bar-left">
<a class="top-bar-logo" href="../index.html"><img alt="彩翼高科" class="logo-img" src="../logo.dc57457c.png"/></a>
<span class="top-bar-title">彩翼公共采购智能体协同管理平台</span>
</div>
<div class="top-bar-right">
<div class="id-switcher" id="idSwitcher">
<div class="id-trigger" onclick="toggleIdMenu()">
<div class="id-avatar">李</div>
<div class="id-info">
<span class="id-org">广州某某科技有限公司</span>
<span class="id-type-badge">采购单位</span>
</div>
<span class="id-chevron">▾</span>
</div>
<div class="id-menu">
<div class="id-menu-hd">切换工作台身份</div>
<div class="id-menu-item current">
<div class="id-dot active"></div>
<div class="id-item-body">
<div class="id-item-org">广州某某科技有限公司</div>
<div class="id-item-type">采购单位</div>
</div>
<span class="id-item-tag current-tag">当前</span>
</div>
<div class="id-menu-item" onclick="location.href='../developer/index.html'">
<div class="id-dot idle"></div>
<div class="id-item-body">
<div class="id-item-org">广州某某科技有限公司</div>
<div class="id-item-type">开发者</div>
</div>
</div>
<div class="id-menu-sep"></div>
<a class="id-menu-action" href="../user/register-select.html">＋ 注册新机构类型</a>
<a class="id-menu-action" href="#" onclick="alert('已退出登录');return false;">退出登录</a>
</div>
</div>
<script>
function toggleIdMenu(){
  var el=document.getElementById('idSwitcher');
  el.classList.toggle('open');
}
document.addEventListener('click',function(e){
  var sw=document.getElementById('idSwitcher');
  if(sw && !sw.contains(e.target)) sw.classList.remove('open');
});
</script>
</div>
