<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>消费记录 - 用户端</title><link href="../styles.css" rel="stylesheet"/>
<link href="_bento-lite-skin.css" rel="stylesheet">
<link href="_glass-soft-skin.css" rel="stylesheet"/>
<script src="../app.js"></script>
<link href="bean-plan.css" rel="stylesheet"/>
<script src="bean-plan.js"></script><style>
:root{--ink:#172b4d;--blue:#2563eb;--bg:#f6f8fc;--line:#e1e9f4;--muted:#708199}.main-content{background:var(--bg);padding:28px 32px 44px}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;padding:24px 27px;border:1px solid #c9dcfb;border-radius:16px;background:linear-gradient(125deg,#fff,#f2f7ff)}.page-head h2{margin:0;color:var(--ink);font-size:24px}.page-head p{margin:7px 0 0;color:var(--muted);font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}.stat{padding:18px;border:1px solid var(--line);border-radius:13px;background:#fff}.stat span{display:block;color:#7e8fa5;font-size:12px}.stat b{display:block;margin-top:7px;color:var(--ink);font-size:22px}.panel{overflow:hidden;border:1px solid var(--line);border-radius:14px;background:#fff}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 19px;border-bottom:1px solid var(--line)}.tb-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.tb-left select{height:36px;padding:0 10px;border:1px solid #dfe8f5;border-radius:8px;background:#fff;color:#4c5e76;font-size:13px;cursor:pointer}.search{width:220px;padding:9px 11px;border:1px solid #dfe8f5;border-radius:8px;background:#fbfdff;font-size:12px}.table-wrap{overflow-x:auto}.table{width:100%;min-width:1080px;border-collapse:collapse;font-size:13px}.table th{padding:12px 16px;background:#fbfcfe;color:#71829a;font-size:11px;text-align:left}.table td{padding:15px 16px;border-top:1px solid #edf2f7;color:#4d6078;vertical-align:top}.order{color:var(--ink);font-weight:700}.agent-name{color:var(--ink);font-weight:700}.sub{margin-top:4px;color:#94a3b8;font-size:11px}.mem{color:#40536b;font-weight:600}.amt{color:#c0392b;font-weight:700}.invoice-status{display:inline-flex;padding:4px 8px;border-radius:99px;font-size:11px;font-weight:700}.invoice-status.eligible{background:#ecfdf5;color:#07845b}.invoice-status.pending{background:#fff7e8;color:#b7791f}.invoice-status.done{background:#eef4ff;color:#2563eb}.invoice-status.none{background:#f1f5f9;color:#64748b}.call-status{display:inline-flex;padding:4px 8px;border-radius:99px;font-size:11px;font-weight:700}.call-status.ok{background:#ecfdf5;color:#07845b}.call-status.fail{background:#fdecec;color:#c0392b}.amt.zero{color:#8a98aa}.empty{display:none;padding:30px;text-align:center;color:#94a3b8}@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.main-content{padding:20px 16px 32px}.page-head{align-items:flex-start;flex-direction:column;padding:21px}.toolbar{align-items:flex-start;flex-direction:column}.search{width:100%}}
.table th,.table td{padding-left:9px!important;padding-right:9px!important}.table td{white-space:nowrap}
</style></head><body class="bento-lite">
<header class="top-bar user"><div class="top-bar-left"><a class="top-bar-logo" href="../index.html"><img alt="彩翼高科" class="logo-img" src="../logo.dc57457c.png"/></a><span class="top-bar-title">彩翼公共采购智能体协同管理平台</span></div><div class="top-bar-right"><div class="top-bar-user"><div class="top-bar-avatar">张</div><span>示例科技有限公司</span></div></div></header>
<aside class="sidebar user"><div class="sidebar-section"><a class="sidebar-link" href="index.html"><span class="icon"><svg viewBox="0 0 24 24"><path d="M4 13h6V4H4v9Zm0 7h6v-4H4v4Zm10 0h6v-9h-6v9Zm0-16v4h6V4h-6Z"/></svg></span><span>概览</span></a><a class="sidebar-link" href="agent-list.html"><span class="icon"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 10h8M8 14h5"/></svg></span><span>智能体市场</span></a><a class="sidebar-link" href="recharge-list.html"><span class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18M16 14h2"/></svg></span><span>账户充值</span></a><a class="sidebar-link" href="payment-accounts.html"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-6 9 6v9H3v-9Z"/><path d="M6 10v9m4-9v9m4-9v9m4-9v9M2 19h20"/></svg></span><span>付款账户</span></a><a class="sidebar-link" href="balance.html"><span class="icon"><svg viewBox="0 0 24 24"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H18a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H6.5A2.5 2.5 0 0 1 4 17.5v-10Z"/><path d="M4 8h13M15 14h3"/></svg></span><span>彩豆管理</span></a><a class="sidebar-link active" href="consumption-list.html"><span class="icon"><svg viewBox="0 0 24 24"><path d="M5 20V10m7 10V4m7 16v-7"/></svg></span><span>消费记录</span></a><a class="sidebar-link" href="invoice-list.html"><span class="icon"><svg viewBox="0 0 24 24"><path d="M6 3h9l3 3v15l-3-2-3 2-3-2-3 2V3Z"/><path d="M9 9h6m-6 4h6"/></svg></span><span>发票管理</span></a><a class="sidebar-link" href="member-list.html"><span class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 20c.6-3.4 3-5 7-5s6.4 1.6 7 5"/></svg></span><span>账号管理</span></a><a class="sidebar-link" href="role-list.html"><span class="icon"><svg viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 4.5 2.9 7.9 7 10 4.1-2.1 7-5.5 7-10V6l-7-3Z"/><path d="M9 12h6m-3-3v6"/></svg></span><span>岗位管理</span></a></div></aside>
<main class="main-content"><section class="page-head"><div><h2>消费记录</h2></div></section>
<section class="stats">
<div class="stat"><span>本月消费</span><b id="statMonth">—</b></div>
<div class="stat"><span>本月成功调用</span><b id="statCalls">—</b></div>
<div class="stat"><span id="statBalLabel">单位彩豆余额</span><b id="statBalance">—</b></div>
<div class="stat" id="statInvBox"><span>可开票金额</span><b id="statInvoicable" style="color:#b7791f">—</b></div>
</section>
<section class="panel"><div class="toolbar"><div class="tb-left"><select id="memberFilter" aria-label="按成员筛选"><option value="all">全部成员</option><option value="张敏">张敏</option><option value="王晨">王晨</option><option value="李用户">李用户</option><option value="陈晓">陈晓</option></select></div><input class="search" id="search" placeholder="搜索消费单号或智能体" aria-label="搜索消费单号或智能体"/></div><div class="table-wrap"><table class="table"><thead><tr><th>消费单号</th><th>消费时间</th><th>智能体</th><th data-member-col>消费人</th><th>消费彩豆</th><th>扣减来源</th><th>余额变动</th><th>调用状态</th><th data-invoice-col>开票状态</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><div class="empty" id="empty">未找到匹配记录</div><div class="records-footer"><span id="conCount"></span><div class="pager"><button id="conPrev" type="button" aria-label="上一页">‹</button><span class="page-current" id="conCur">1</span><button id="conNext" type="button" aria-label="下一页">›</button></div></div></section></main>
<script>
(function(){
var B=window.BeanPlan, personal=B.isPersonal(), CON_SIZE=8, conPage=1, all=B.consumptions();
var INV={eligible:['待开票','eligible'],pending:['开票中','pending'],done:['已开票','done'],none:['不可开票','none']};
function sources(fl){
  var out=[];['free','plan','recharge'].forEach(function(k){var v=fl.parts[k];if(v)out.push('<span class="bp-src s-'+k+'">'+B.SOURCE_LABEL[k].replace('彩豆','')+' −'+B.fmt(-v)+'</span>');});
  return out.join('')||'<span class="sub">—</span>';
}
function noteFor(fl){
  if(B.isFailed(fl)) return '';
  var p=fl.parts;
  if(fl.meta.invoice==='none'&&p.plan<0&&!p.recharge) return '<div class="sub">按年包订单开票</div>';
  return '';
}
function stats(){
  var s=B.monthStats(), b=B.buckets(), inv=0;
  B.invoiceableConsumptions().forEach(function(r){inv+=B.invoiceBase(r.flow);});
  document.getElementById('statMonth').textContent=B.fmt(s.consume)+' 彩豆';
  document.getElementById('statCalls').textContent=s.calls+' 次';
  document.getElementById('statBalLabel').textContent=B.walletName()+'余额';
  document.getElementById('statBalance').textContent=B.fmt(b.total)+' 彩豆';
  document.getElementById('statInvoicable').textContent=B.money(inv);
}
function render(){
  var m=document.getElementById('memberFilter').value, k=document.getElementById('search').value.trim().toLowerCase();
  var rows=all.filter(function(r){var fl=r.flow;return (m==='all'||fl.who===m)&&(!k||(fl.orderNo+' '+fl.title+' '+fl.who+(B.isFailed(fl)?' 失败':'')).toLowerCase().indexOf(k)>-1);});
  var pages=Math.max(1,Math.ceil(rows.length/CON_SIZE)); conPage=Math.min(Math.max(1,conPage),pages);
  document.getElementById('rows').innerHTML=rows.slice((conPage-1)*CON_SIZE,conPage*CON_SIZE).map(function(r){
    var fl=r.flow, failed=B.isFailed(fl), inv=INV[fl.meta.invoice], d=fl.time.split(' ');
    return '<tr><td><div class="order">'+B.esc(fl.orderNo)+'</div></td><td>'+d[0]+'<br/><span class="sub">'+d[1]+'</span></td>'+
      '<td><div class="agent-name">'+B.esc(fl.title)+'</div><div class="sub">'+fl.meta.billing+'</div></td>'+
      (personal?'':'<td data-member-col><span class="mem">'+B.esc(fl.who)+'</span></td>')+
      '<td><span class="amt'+(failed?' zero':'')+'">'+(failed?'0.00':'−'+B.fmt(-r.delta))+'</span></td>'+
      '<td>'+sources(fl)+'</td><td>'+B.fmt(r.before)+'<div class="sub">→ '+B.fmt(r.after)+'</div></td>'+
      '<td><span class="call-status '+(failed?'fail':'ok')+'">'+fl.meta.status+'</span></td>'+
      '<td data-invoice-col><span class="invoice-status '+inv[1]+'">'+inv[0]+'</span>'+noteFor(fl)+'</td>'+
      '<td><a class="btn btn-sm btn-outline" href="consumption-view.html?order='+encodeURIComponent(fl.orderNo)+'">查看</a></td></tr>';
  }).join('');
  document.getElementById('empty').style.display=rows.length?'none':'block';
  document.getElementById('conCount').textContent='共 '+rows.length+' 条记录';
  document.getElementById('conCur').textContent=conPage;
  document.getElementById('conPrev').disabled=conPage<=1; document.getElementById('conNext').disabled=conPage>=pages;
}
if(personal){
  document.querySelectorAll('[data-member-col]').forEach(function(e){e.remove();});
  document.getElementById('memberFilter').parentNode.style.display='none';
}
document.getElementById('memberFilter').addEventListener('change',function(){conPage=1;render();});
document.getElementById('search').addEventListener('input',function(){conPage=1;render();});
document.getElementById('conPrev').onclick=function(){conPage--;render();};
document.getElementById('conNext').onclick=function(){conPage++;render();};
stats(); render();
})();
</script></body></html>
