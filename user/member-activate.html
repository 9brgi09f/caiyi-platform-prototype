<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>激活机构账号 - 彩翼平台</title><link href="../styles.css" rel="stylesheet"/><style>:root{--ink:#172b4d;--blue:#2563eb;--canvas:#f6f8fc;--line:#e6ecf5;--muted:#708199}.page{min-height:100vh;display:grid;place-items:center;padding:28px 16px;background:linear-gradient(135deg,#f7faff,#eef5ff)}.card{width:min(560px,100%);overflow:hidden;border:1px solid #d9e6fa;border-radius:18px;background:#fff;box-shadow:0 16px 40px rgba(37,99,235,.1)}.head{padding:26px 30px 20px;background:linear-gradient(115deg,#fff,#eff6ff);border-bottom:1px solid var(--line)}.brand{margin-bottom:16px;color:var(--blue);font-size:13px;font-weight:700}.head h1{margin:0;color:var(--ink);font-size:23px}.head p{margin:7px 0 0;color:var(--muted);font-size:13px}.body{padding:24px 30px 28px}.invite{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:15px;border:1px solid #dbe7f7;border-radius:12px;background:#fafcff}.label{display:block;margin-bottom:4px;color:#94a3b8;font-size:11px}.value{color:#42536c;font-size:14px;font-weight:600}.roles{display:flex;flex-wrap:wrap;gap:6px}.roles span{padding:3px 8px;border-radius:6px;background:#eff4ff;color:#2563eb;font-size:12px}.form{display:grid;gap:16px;margin-top:22px}.field label{display:block;margin-bottom:6px;color:#42536c;font-size:13px}.req{color:#ef4444}.field input{width:100%;height:42px;padding:0 11px;border:1px solid #d9e4f2;border-radius:8px;font-size:14px}.field input:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px #eff4ff}.hint{margin:6px 0 0;color:#8291a6;font-size:12px}.actions{display:flex;gap:10px;margin-top:24px}.actions .btn{flex:1}.success{display:none;text-align:center}.success .mark{display:grid;place-items:center;width:52px;height:52px;margin:4px auto 14px;border-radius:50%;background:#ecfdf5;color:#047857;font-size:28px}.success h2{margin:0;color:var(--ink);font-size:20px}.success p{margin:8px 0 20px;color:var(--muted);font-size:13px}.notice{margin-top:17px;color:#8291a6;font-size:12px;line-height:1.7}@media(max-width:560px){.head,.body{padding-left:21px;padding-right:21px}.invite{grid-template-columns:1fr}.actions{flex-direction:column}}</style></head><body><main class="page"><section class="card"><header class="head"><div class="brand">彩翼公共采购智能体协同管理平台</div><h1>激活机构账号</h1><p>完成手机号验证和密码设置后，即可加入机构并使用已分配的岗位权限。</p></header><div class="body"><div id="activateForm"><div class="invite"><div><span class="label">邀请机构</span><span class="value" id="orgName">广州某某科技有限公司</span></div><div><span class="label">受邀手机号</span><span class="value" id="phoneMasked">137****9012</span></div><div style="grid-column:1/-1"><span class="label">分配岗位</span><div class="roles" id="roleList"><span>示例岗位 C</span></div></div></div><form class="form" onsubmit="activate(event)"><div class="field"><label>短信验证码 <span class="req">*</span></label><div style="display:flex;gap:8px"><input required maxlength="6" placeholder="请输入6位验证码"/><button class="btn btn-outline" type="button" onclick="this.textContent='已发送'">获取验证码</button></div><p class="hint">验证码将发送至受邀手机号。</p></div><div class="field"><label>设置登录密码 <span class="req">*</span></label><input id="password" required type="password" minlength="8" placeholder="8—20位，含字母、数字和符号中的两种"/></div><div class="field"><label>确认登录密码 <span class="req">*</span></label><input id="confirmPassword" required type="password" minlength="8" placeholder="请再次输入登录密码"/></div><div class="actions"><button class="btn btn-primary" type="submit">确认激活并加入机构</button></div></form><p class="notice">本链接仅用于本次机构邀请激活；激活后，您的平台个人账号及其它机构身份均独立保留。</p></div><div class="success" id="success"><div class="mark">✓</div><h2>机构账号已激活</h2><p>您已加入<span id="successOrg">广州某某科技有限公司</span>，可使用已分配岗位的权限。</p><a class="btn btn-primary" href="login.html">去登录</a></div></div></section></main><script>var q=new URLSearchParams(location.search),o=q.get('org'),p=q.get('phone'),r=q.get('roles');if(o){document.getElementById('orgName').textContent=o;document.getElementById('successOrg').textContent=o}if(p)document.getElementById('phoneMasked').textContent=p;if(r)document.getElementById('roleList').innerHTML=r.split(',').map(function(x){return'<span>'+x+'</span>'}).join('');function activate(e){e.preventDefault();if(document.getElementById('password').value!==document.getElementById('confirmPassword').value){alert('两次输入的密码不一致。');return}document.getElementById('activateForm').style.display='none';document.getElementById('success').style.display='block'}</script></body></html>
