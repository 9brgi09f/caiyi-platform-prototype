<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>机构类型详情 - 平台管理端</title>
<link href="../styles.css" rel="stylesheet"/>
<script src="../app.js"></script>
<style>
.page-header{background:linear-gradient(135deg,#2563EB,#1D4ED8);color:white;padding:var(--spacing-lg) var(--spacing-xl);border-radius:var(--radius-lg);margin-bottom:var(--spacing-lg);}
.page-header h2{color:white;margin-bottom:var(--spacing-xs);}
.page-header p{opacity:.9;font-size:14px;margin:0;}
.back-link{display:inline-block;margin-bottom:var(--spacing-sm);color:rgba(255,255,255,.9);font-size:14px;text-decoration:none;}
.back-link:hover{color:white;text-decoration:underline;}
.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--spacing-lg);}
.detail-item{padding:var(--spacing-md) 0;border-bottom:1px solid var(--border-light);}
.detail-item.full-width{grid-column:1 / -1;}
.detail-label{margin-bottom:6px;font-size:13px;color:var(--text-muted);}
.detail-value{font-size:15px;font-weight:500;color:var(--text-primary);line-height:1.6;}
.detail-note{margin-top:var(--spacing-lg);padding:var(--spacing-md);border-radius:var(--radius-md);background:var(--bg-light);font-size:13px;color:var(--text-secondary);line-height:1.7;}
.card-actions{display:flex;justify-content:flex-end;margin-top:var(--spacing-lg);padding-top:var(--spacing-lg);border-top:1px solid var(--border-light);}
@media(max-width:720px){.detail-grid{grid-template-columns:1fr;}.detail-item.full-width{grid-column:auto;}}
</style>
</head>
<body>
<header class="top-bar admin">
  <div class="top-bar-left">
    <a class="top-bar-logo" href="../index.html"><img alt="彩翼高科" class="logo-img" src="../logo.dc57457c.png"/></a>
    <span class="top-bar-title">彩翼公共采购智能体协同管理平台</span>
  </div>
  <div class="top-bar-right"><div class="top-bar-user"><div class="top-bar-avatar">管</div><span>管理员</span></div></div>
</header>
<aside class="sidebar admin">
  <div class="sidebar-section">
    <a class="sidebar-link" href="index.html"><span class="icon">📊</span><span>概览</span></a>
    <a class="sidebar-link" href="recharge-records.html"><span class="icon">💰</span><span>充值记录</span></a>
    <a class="sidebar-link" href="consumption-records.html"><span class="icon">📊</span><span>消费记录</span></a>
    <a class="sidebar-link" href="agent-audit-list.html"><span class="icon">🤖</span><span>智能体管理</span></a>
    <a class="sidebar-link" href="channel-list.html"><span class="icon">📡</span><span>渠道管理</span></a>
    <a class="sidebar-link" href="invoice-list.html"><span class="icon">📄</span><span>发票管理</span></a>
    <a class="sidebar-link" href="settlement-list.html"><span class="icon">📈</span><span>结算管理</span></a>
    <a class="sidebar-link" href="withdrawal-audit-list.html"><span class="icon">💸</span><span>提现审核</span></a>
    <a class="sidebar-link" href="reconciliation-list.html"><span class="icon">🧮</span><span>账户对账</span></a>
    
    <a class="sidebar-link active" href="org-type-list.html"><span class="icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V8l7-4 7 4v13"/><path d="M9 21v-6h6v6"/><path d="M9 10h.01M15 10h.01"/></svg></span><span>机构管理</span></a>
    <a class="sidebar-link" href="rules-list.html"><span class="icon">⚙️</span><span>规则设置</span></a>
  </div>
</aside>
<main class="main-content">
  <div class="page-header">
    <a class="back-link" href="org-type-list.html">← 返回机构类型列表</a>
    <h2>机构类型详情</h2>
    <p>查看机构类型的注册与审核配置</p>
  </div>
  <div class="content-card">
    <div class="content-card-header"><h3 class="content-card-title">基础配置</h3></div>
    <div class="detail-grid">
      <div class="detail-item">
        <div class="detail-label">类型名称</div>
        <div class="detail-value">采购单位</div>
      </div>
      <div class="detail-item">
        <div class="detail-label">注册渠道</div>
        <div class="detail-value"><span class="badge badge-yes">公开注册</span></div>
      </div>
      <div class="detail-item full-width">
        <div class="detail-label">类型说明</div>
        <div class="detail-value">政府及企事业单位采购方</div>
      </div>
      <div class="detail-item">
        <div class="detail-label">审核方式</div>
        <div class="detail-value"><span class="badge badge-yes">需要审核</span></div>
      </div>
    </div>
    <div class="detail-note">公开注册用户提交申请后将进入运营审核，审核通过后可登录使用平台服务。</div>
    <div class="card-actions"><a class="btn btn-primary" href="org-type-edit.html">编辑机构类型</a></div>
  </div>
</main>
</body>
</html>
