        .page-header {
            background: linear-gradient(135deg, #2563EB, #1D4ED8);
            color: white; padding: var(--spacing-lg) var(--spacing-xl);
            border-radius: var(--radius-lg); margin-bottom: var(--spacing-lg);
        }
        .page-header h2 { color: white; margin-bottom: var(--spacing-xs); }
        .page-header p { opacity: 0.9; font-size: 14px; }
        .form-section {
            background: var(--card-bg); border: 1px solid var(--border-light);
            border-radius: var(--radius-lg); padding: var(--spacing-xl);
            margin-bottom: var(--spacing-lg);

        .form-section-title {
            font-size: 16px; font-weight: 600; margin-bottom: var(--spacing-lg);
            padding-bottom: var(--spacing-md); border-bottom: 1px solid var(--border-light);

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: var(--spacing-lg); }
        .form-item { display: flex; flex-direction: column; gap: var(--spacing-xs); }
        .form-item.full-width { grid-column: 1 / -1; }
        .form-label { font-size: 14px; font-weight: 500; color: var(--text-primary); }
        .form-hint { font-size: 12px; color: var(--text-muted); }
        .tier-card { display: flex; align-items: center; gap: var(--spacing-md); padding: var(--spacing-md); background: var(--bg-light); border-radius: var(--radius-md); margin-bottom: var(--spacing-md); }
        .tier-badge { width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 600; color: white; }

<h2>入驻规则</h2>
<p>配置智能体入驻审核规则</p>
</div>
<form class="form-section">
<h3 class="form-section-title">入驻规则</h3>
<div class="form-grid">
<div class="form-item">
<label class="form-label">入驻审核方式</label>
<select class="select">
<option selected="" value="manual">人工审核</option>
<option value="auto">自动审核</option>
<option value="none">无需审核</option>
</select>
</div>
<div class="form-item">
<label class="form-label">审核期限</label>
<div style="display: flex; align-items: center; gap: var(--spacing-sm);">
<input class="input" style="width: 80px;" type="number" value="3"/>
<span>工作日内完成</span>
</div>
</div>
<div class="form-item">
<label class="form-label">最低保证金</label>
<div style="display: flex; align-items: center; gap: var(--spacing-sm);">
<input class="input" style="width: 100px;" type="number" value="0"/>
<span>元</span>
</div>
<span class="form-hint">入驻时需缴纳的保证金（0表示免保证金）</span>
</div>
<div class="form-item">
<label class="form-label">开发者资质要求</label>
<select class="select">
<option selected="" value="personal">个人开发者</option>
<option value="enterprise">企业开发者</option>
<option value="both">个人/企业均可</option>
</select>
</div>
</div>
<div class="form-item full-width" style="margin-top: var(--spacing-md);">
<label style="display: flex; align-items: center; gap: var(--spacing-md); padding: var(--spacing-md); background: var(--bg-light); border-radius: var(--radius-md);">
<input checked="" type="checkbox"/>
<div>
<div style="font-weight: 500;">需要签署入驻协议</div>
<div style="font-size: 12px; color: var(--text-muted);">开发者入驻前需签署平台服务协议</div>
</div>
</label>
</div>
</form>
