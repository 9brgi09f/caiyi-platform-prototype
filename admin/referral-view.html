};

var st = document.getElementById('pgStatus');
st.textContent = d.status;
st.className = 'badge ' + d.badge;
st.style.fontSize = '13px';

  return '<div class="info-item"><div class="k">' + m[0] + '</div><div class="v">' + m[1] + '</div></div>';
}).join('');
document.getElementById('matList').innerHTML = d.mat.map(function(m){

}).join('');

document.getElementById('vPartner').textContent = d.partner;
document.getElementById('vShareNote').textContent = d.note;
function showToast(msg, icon){
  var t = document.getElementById('toast');
  t.textContent = (icon || '✓') + ' ' + msg;
  t.style.display = 'block';
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.style.display = 'none'; }, 2400);
}
