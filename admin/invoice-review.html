        .form-label { font-size: 14px; font-weight: 500; color: var(--text-primary); margin-bottom: var(--spacing-xs); display: block; }

<div class="page-header">
<a class="back-link" href="invoice-list.html" style="color: white; margin-bottom: var(--spacing-sm);">← 返回列表</a>
<h2>审核发票</h2>
<p>审核用户发票申请</p>
</div>
<div class="info-grid">
<div class="info-card">
<div class="info-label">用户</div>
<div class="info-value">北京科技有限公司</div>
</div>
<div class="info-card">
<div class="info-label">发票金额</div>
<div class="info-value" style="color: var(--admin-color);">¥50.00</div>
</div>
<div class="info-card">
<div class="info-label">发票抬头</div>
<div class="info-value">北京科技有限公司</div>
</div>
<div class="info-card">
<div class="info-label">发票类别</div>
<div class="info-value">充值发票</div>
</div>
<div class="info-card">
<div class="info-label">发票类型</div>
<div class="info-value">预付卡发票（0税率）</div>
</div>
</div>
<form class="form-section">
<h3 class="form-section-title">审核操作</h3>
<div class="form-item">
<label class="form-label">审核结果</label>
<div style="display: flex; gap: var(--spacing-md);">
<label style="display: flex; align-items: center; gap: var(--spacing-sm); padding: var(--spacing-md); border: 2px solid var(--success-color); border-radius: var(--radius-lg); cursor: pointer; flex: 1; background: var(--success-light);">
<input checked="" name="result" type="radio" value="approve"/>
<span>通过审核</span>
</label>
<label style="display: flex; align-items: center; gap: var(--spacing-sm); padding: var(--spacing-md); border: 2px solid var(--border-light); border-radius: var(--radius-lg); cursor: pointer; flex: 1;">
<input name="result" type="radio" value="reject"/>
<span>驳回申请</span>
</label>
</div>
</div>
<div class="form-item">
<label class="form-label">审核备注</label>
<textarea class="input" id="reviewRemark" placeholder="请输入审核备注..." rows="3"></textarea>
</div>
</form>
<div style="display: flex; gap: var(--spacing-md); justify-content: center;">
<a class="btn btn-outline" href="invoice-list.html">取消</a>
<button class="btn btn-primary" onclick="submitReview()">确认审核</button>
</div></main>
<script>
        function submitReview() {
            const approved = document.querySelector('input[name="result"]:checked').value === 'approve';
            if (approved) {
                if (confirm('确认审核通过？通过后系统将自动提交开票。')) {
                    alert('审核已通过，已自动提交开票');
                    window.location.href = 'invoice-list.html';
                }
            } else {
                const remark = document.getElementById('reviewRemark').value;
                if (!remark) {
                    alert('驳回申请需填写审核备注（驳回原因）');
                    return;
                }
                if (confirm('确认驳回该申请？')) {
                    alert('已驳回申请，已通知用户');
                    window.location.href = 'invoice-list.html';
                }
            }
        }
    </script>
