        }
        .page-header h2 { color: white; margin-bottom: var(--spacing-xs); }
        .page-header p { opacity: 0.9; font-size: 14px; }
        .form-section {
            background: var(--card-bg); border: 1px solid var(--border-light);
            border-radius: var(--radius-lg); padding: var(--spacing-xl);
            margin-bottom: var(--spacing-lg);
        }
        .form-section-title {
            font-size: 16px; font-weight: 600; margin-bottom: var(--spacing-lg);

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: var(--spacing-lg); }

        .form-hint { font-size: 12px; color: var(--text-muted); }
    </style>

<div class="page-header">
<a class="back-link" href="rules-list.html" style="color: white; margin-bottom: var(--spacing-sm);">← 返回列表</a>
<h2>消费规则</h2>
<p>配置消费模式、扣费策略和余额提醒规则</p>
</div>
<form class="form-section">
<h3 class="form-section-title">扣费模式配置</h3>
<div class="form-grid">
<div class="form-item">
<label class="form-label">扣费模式</label>
<select class="select">
<option selected="" value="pre">预扣费（先扣后扣）</option>
<option value="post">后扣费（先使用后扣费）</option>
</select>
<span class="form-hint">预扣费：调用前预扣一定金额，按实际消耗结算</span>
</div>
<div class="form-item">
<label class="form-label">预扣金额</label>
<div style="display: flex; align-items: center; gap: var(--spacing-sm);">
<input class="input" style="width: 100px;" type="number" value="10"/>
<span>元</span>
</div>
<span class="form-hint">每次调用前预扣金额，多退少补</span>
</div>
<div class="form-item">
<label class="form-label">结算周期</label>
<select class="select">
<option selected="" value="realtime">实时结算</option>
<option value="hourly">每小时结算</option>
<option value="daily">每日结算</option>
</select>
</div>
<div class="form-item">
<label class="form-label">余额不足时的处理</label>
<select class="select">
<option selected="" value="block">禁止调用</option>
<option value="allow">允许调用（产生负余额）</option>
</select>
</div>
</div>
</form>
<form class="form-section">
<h3 class="form-section-title">余额提醒规则</h3>
<div class="form-grid">
<div class="form-item">
<label class="form-label">低余额提醒阈值</label>
<div style="display: flex; align-items: center; gap: var(--spacing-sm);">
<input class="input" style="width: 100px;" type="number" value="10"/>
<span>元</span>
</div>
<span class="form-hint">余额低于此值时发送提醒</span>
</div>
<div class="form-item">
<label class="form-label">提醒频率</label>
<select class="select">
<option value="once">仅提醒一次</option>
<option selected="" value="daily">每天提醒一次</option>
<option value="everycall">每次调用时提醒</option>
</select>
</div>
<div class="form-item">
<label class="form-label">余额耗尽提醒</label>
<select class="select">
<option selected="" value="enable">启用</option>
<option value="disable">禁用</option>
</select>
</div>
</div>
<div class="form-item full-width" style="margin-top: var(--spacing-lg);">
<label style="display: flex; align-items: center; gap: var(--spacing-md); padding: var(--spacing-md); background: var(--bg-light); border-radius: var(--radius-md);">
<input checked="" type="checkbox"/>
<div>
<div style="font-weight: 500;">短信提醒</div>
<div style="font-size: 12px; color: var(--text-muted);">通过短信发送余额提醒</div>
</div>
</label>
</div>
<div class="form-item full-width" style="margin-top: var(--spacing-md);">
<label style="display: flex; align-items: center; gap: var(--spacing-md); padding: var(--spacing-md); background: var(--bg-light); border-radius: var(--radius-md);">
<input checked="" type="checkbox"/>
<div>
<div style="font-weight: 500;">应用内通知</div>
<div style="font-size: 12px; color: var(--text-muted);">通过应用内消息发送提醒</div>
</div>
</label>
</div>
</form>
<form class="form-section">
<h3 class="form-section-title">消费限制规则</h3>
<div class="form-grid">
<div class="form-item">
<label class="form-label">单次调用最大消费</label>
<div style="display: flex; align-items: center; gap: var(--spacing-sm);">
<input class="input" style="width: 100px;" type="number" value="100"/>
<span>元</span>
</div>
<span class="form-hint">单次调用消费上限，超出将中断</span>
</div>
<div class="form-item">
<label class="form-label">日消费上限</label>
<div style="display: flex; align-items: center; gap: var(--spacing-sm);">
<input class="input" style="width: 120px;" type="number" value="1000"/>
<span>元</span>
</div>
<span class="form-hint">每日消费金额上限</span>
</div>
<div class="form-item">
<label class="form-label">月度消费上限</label>
<div style="display: flex; align-items: center; gap: var(--spacing-sm);">
<input class="input" style="width: 120px;" type="number" value="10000"/>
<span>元</span>
</div>
</div>
</div>
<div class="form-item full-width" style="margin-top: var(--spacing-md);">
<label style="display: flex; align-items: center; gap: var(--spacing-md); padding: var(--spacing-md); background: var(--bg-light); border-radius: var(--radius-md);">
<input type="checkbox"/>
<div>
<div style="font-weight: 500;">启用消费上限</div>
<div style="font-size: 12px; color: var(--text-muted);">用户可自行设置消费上限，达到后自动停用</div>
</div>
</label>
</div>
</form>
<div style="display: flex; gap: var(--spacing-md); justify-content: center;">
<a class="btn btn-outline" href="rules-list.html">取消</a>
<button class="btn btn-primary" type="submit">保存配置</button>
</div>
</main>
</body>
