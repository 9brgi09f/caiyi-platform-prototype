            background: linear-gradient(135deg, #2563EB, #1D4ED8);

        }

        .form-section {
            background: var(--card-bg); border: 1px solid var(--border-light);
            border-radius: var(--radius-lg); padding: var(--spacing-xl);

        }
        .form-section-title {

            padding-bottom: var(--spacing-md); border-bottom: 1px solid var(--border-light);
        }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: var(--spacing-lg); }
        .form-item { display: flex; flex-direction: column; gap: var(--spacing-xs); }

        .form-label { font-size: 14px; font-weight: 500; color: var(--text-primary); }
        .form-hint { font-size: 12px; color: var(--text-muted); }
    </style>

<main class="main-content">
<div class="page-header">
<a class="back-link" href="rules-list.html" style="color: white; margin-bottom: var(--spacing-sm);">← 返回列表</a>
<h2>编辑规则</h2>
<p>修改提现规则配置</p>
</div>
<form class="form-section">
<h3 class="form-section-title">基础配置</h3>
<div class="form-grid">
<div class="form-item">
<label class="form-label">最低提现金额</label>
<div style="display: flex; align-items: center; gap: var(--spacing-sm);">
<input class="input" style="width: 100px;" type="number" min="100" value="100" id="minWithdraw" oninput="checkMinWithdraw(this)"/>
<span>元</span>
</div>
<span class="form-hint" id="minWithdrawHint">开发者每次提现金额不得低于此值；平台规定不可设置为低于 100 元。</span>
</div>
<div class="form-item">
<label class="form-label">结算周期</label>
<select class="select">
<option selected="" value="monthly">按月结算</option>
<option value="quarterly">按季结算</option>
</select>
</div>
</div>
</form>
<div style="display: flex; gap: var(--spacing-md); justify-content: center;">
<a class="btn btn-outline" href="rules-list.html">取消</a>
<button class="btn btn-primary" type="submit" id="saveRulesBtn">保存配置</button>
</div>
</main>
<script>
function checkMinWithdraw(el){
  var hint = document.getElementById('minWithdrawHint');
  var saveBtn = document.getElementById('saveRulesBtn');
  var v = parseFloat(el.value);
  if (!isNaN(v) && v < 100) {
    el.style.borderColor = '#dc2626';
    hint.textContent = '最低提现金额不可设置为低于 100 元';
    hint.style.color = '#dc2626';
    if (saveBtn) { saveBtn.disabled = true; saveBtn.style.opacity = '0.5'; saveBtn.style.pointerEvents = 'none'; }
  } else {
    el.style.borderColor = '';
    hint.textContent = '开发者每次提现金额不得低于此值；平台规定不可设置为低于 100 元。';
    hint.style.color = '';
    if (saveBtn) { saveBtn.disabled = false; saveBtn.style.opacity = ''; saveBtn.style.pointerEvents = ''; }
  }
}
</script>
</body>
