        .status-item { position: relative; padding-bottom: var(--spacing-lg); }

        .status-item.completed::before { background: var(--success-color); }
        .status-time { font-size: 12px; color: var(--text-muted); margin-bottom: var(--spacing-xs); }
        .status-text { font-weight: 500; color: var(--text-primary); }
        .status-item.active .status-text { color: var(--developer-color); }

        if (d.note.type === 'error') { nb.style.background = '#fee2e2'; nb.style.color = '#dc2626'; }
        else if (d.note.type === 'warn') { nb.style.background = '#fef3c7'; nb.style.color = '#92400e'; }
        else { nb.style.background = 'var(--border-light)'; nb.style.color = 'var(--text-secondary)'; }
    }

    // 发票信息卡：无发票则隐藏
    if (d.invoiceFile) {
        setText('dvInvoiceFile', d.invoiceFile[0]);
        setText('dvInvoiceMeta', d.invoiceFile[1]);
    } else {
        document.getElementById('dvInvoiceCard').style.display = 'none';
    }

    // 处理进度时间线
    var tl = d.timeline.map(function(s){
        return '<div class="status-item ' + s[2] + '"><div class="status-time">' + (s[0] || '—') + '</div><div class="status-text">' + s[1] + '</div></div>';
    }).join('');
    document.getElementById('dvTimeline').innerHTML = tl;
</script>
</body>
</html>
