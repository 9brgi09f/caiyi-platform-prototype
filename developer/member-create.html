<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>新增子账号 - 开发者端</title><link href="../styles.css" rel="stylesheet"/><style>body{background:#f6f8fc}.main-content{padding:28px 32px}.head{padding:24px 27px;border:1px solid #d9e6fa;border-radius:16px;background:linear-gradient(115deg,#fff,#eff6ff);margin-bottom:18px}.head h2{margin:9px 0 0;color:#172b4d}.head p{margin:6px 0 0;color:#708199;font-size:13px}.card{max-width:760px;padding:24px 28px;border:1px solid #e6ecf5;border-radius:14px;background:#fff}.field{margin-bottom:16px}.field label{display:block;margin-bottom:6px;font-size:13px;color:#42536c}.field input,.field select{width:100%;height:42px;padding:0 11px;border:1px solid #d9e4f2;border-radius:8px;font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.note{margin:16px 0;padding:12px;border-radius:9px;background:#f5f9ff;color:#315889;font-size:12px;line-height:1.7}.result{display:none;margin-top:14px;padding:12px;border-radius:9px;background:#effcf6;color:#06734c;font-size:13px}.actions{display:flex;gap:10px;margin-top:23px}@media(max-width:650px){.main-content{padding:18px 16px}.grid{grid-template-columns:1fr}.actions{flex-direction:column}}</style></head><body><header class="top-bar developer"><div class="top-bar-left"><a class="top-bar-logo" href="../index.html"><img alt="彩翼高科" class="logo-img" src="../logo.dc57457c.png"/></a><span class="top-bar-title">彩翼公共采购智能体协同管理平台</span></div></header><main class="main-content"><div class="head"><a href="member-list.html" style="color:#2563eb;text-decoration:none;font-size:13px">← 返回成员与岗位</a><h2>新增子账号</h2><p>为开发者机构成员分配岗位及智能体协作权限。</p></div><form class="card" onsubmit="save(event)"><div class="grid"><div class="field"><label>姓名 *</label><input required placeholder="请输入员工姓名"/></div><div class="field"><label>手机号 *</label><input id="phone" required maxlength="11" placeholder="请输入11位手机号"/></div></div><div class="grid"><div class="field"><label>岗位 *</label><select required><option value="">请选择岗位</option><option>机构管理员</option><option>智能体运营专员</option><option>财务专员</option><option>只读人员</option></select></div><div class="field"><label>附加岗位</label><select><option>不添加</option><option>只读人员</option></select></div></div><div class="note"><b>激活规则：</b>已注册手机号直接关联开发者机构；未注册手机号将收到激活邀请。员工激活后创建或绑定平台个人账号，不自动成为个人用户。若首次获得智能体使用权限，可获得一次性免费体验资格。</div><div class="result" id="result"></div><div class="actions"><button class="btn btn-primary">保存并发送邀请</button><a class="btn btn-outline" href="member-list.html">取消</a></div></form></main><script>function save(e){e.preventDefault();var p=document.getElementById('phone').value;var r=document.getElementById('result');r.style.display='block';r.textContent=p.endsWith('8')?'已关联已有平台个人账号并分配岗位。':'已创建待激活子账号，邀请已发送；员工完成激活后自动关联开发者机构与岗位。'}</script></body></html>
