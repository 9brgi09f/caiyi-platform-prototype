<div class="table-wrapper"><table class="table table-wide"><thead><tr><th>成员</th><th>手机号</th><th>机构角色</th><th>加入状态</th><th>加入/邀请时间</th><th>操作</th></tr></thead>
<tbody id="memberTable">
<tr data-status="active"><td><div class="member-name">张开发者</div><div class="member-sub">机构主账号</div></td><td>136****3456</td><td><span class="badge role-admin">主账号</span></td><td><span class="badge status-active">已加入</span></td><td>2026-07-05</td><td><span class="text-muted">不可操作</span></td></tr>
<tr data-status="active"><td><div class="member-name">孙月</div></td><td>135****2222</td><td><span class="badge role-operator">操作员</span></td><td><span class="badge status-active">已加入</span></td><td>2026-08-01</td><td><button class="btn btn-sm btn-outline" type="button" onclick="showNotice('角色调整为原型预留操作')">调整角色</button><button class="btn btn-sm btn-outline" type="button" onclick="showNotice('成员已停用（原型演示）')" style="margin-left:6px">停用</button></td></tr>

</main><script>
function searchMembers(){var keyword=document.getElementById('memberSearch').value.trim().replace(/\s/g,'');var visible=0;document.querySelectorAll('#memberTable tr').forEach(function(row){var isVisible=!keyword||row.textContent.replace(/\s/g,'').includes(keyword);row.style.display=isVisible?'':'none';if(isVisible)visible++});document.getElementById('emptyNote').style.display=visible?'none':'block'}
function showNotice(message){alert(message)}
</script>
