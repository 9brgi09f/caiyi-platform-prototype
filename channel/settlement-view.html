<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>结算单详情 - 渠道端</title>
<link href="../styles.css" rel="stylesheet"/>
<script src="../app.js"></script>
<style>
        .page-header {
            background: linear-gradient(135deg, #2563EB, #1D4ED8);
            color: white; padding: var(--spacing-lg) var(--spacing-xl);
            border-radius: var(--radius-lg); margin-bottom: var(--spacing-lg);
        }
        .page-header h2 { color: white; margin-bottom: var(--spacing-xs); }
        .page-header p { opacity: 0.9; font-size: 14px; }
        .info-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--spacing-md); margin-bottom: var(--spacing-lg); }
        .info-card { background: var(--card-bg); border: 1px solid var(--border-light); border-radius: var(--radius-lg); padding: var(--spacing-lg); text-align: center; }
        .info-label { font-size: 13px; color: var(--text-muted); margin-bottom: var(--spacing-xs); }
        .info-value { font-size: 20px; font-weight: 700; }
        .timeline { list-style: none; padding: 0; margin: 0; }
        .timeline li { display: flex; gap: var(--spacing-md); padding: 10px 0; border-left: 2px solid var(--border-light); margin-left: 8px; padding-left: 18px; position: relative; font-size: 14px; }
        .timeline li::before { content: ''; position: absolute; left: -6px; top: 16px; width: 10px; height: 10px; border-radius: 50%; background: var(--border-color); }
        .timeline li.done::before { background: var(--success-color); }
        .timeline li.now::before { background: var(--klein); box-shadow: 0 0 0 4px var(--klein-light); }
        .timeline li.now { font-weight: 600; }
        .timeline .tl-time { color: var(--text-muted); font-size: 12px; min-width: 130px; }
        #toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); background: #1e293b; color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 14px; display: none; z-index: 1200; box-shadow: 0 4px 16px rgba(0,0,0,.25); }
    </style>
</head>
<body>
<header class="top-bar channel">
<div class="top-bar-left">
<a class="top-bar-logo" href="../index.html"><img alt="彩翼高科" class="logo-img" src="../logo.dc57457c.png"/></a>
<span class="top-bar-title">彩翼公共采购智能体协同管理平台</span>
</div>
<div class="top-bar-right">
<div class="top-bar-user">
<div class="top-bar-avatar">渠</div>
<span>智采科技</span>
</div>
</div>
</header>
<aside class="sidebar channel">
<div class="sidebar-section">
<a class="sidebar-link" href="index.html"><span class="icon"></span><span>概览</span></a>
<a class="sidebar-link" href="invite-code.html"><span class="icon"></span><span>我的邀请码</span></a>
<a class="sidebar-link" href="customer-list.html"><span class="icon"></span><span>客户管理</span></a>
<a class="sidebar-link" href="referral-list.html"><span class="icon"></span><span>推荐确认单</span></a>
<a class="sidebar-link active" href="settlement-list.html"><span class="icon"></span><span>分成结算</span></a>
<a class="sidebar-link" href="withdrawal-list.html"><span class="icon"></span><span>提现管理</span></a>
<a class="sidebar-link" href="bank-card.html"><span class="icon"></span><span>收款账户</span></a>
<a class="sidebar-link" href="invoice-list.html"><span class="icon"></span><span>发票管理</span></a>
</div>
</aside>
<main class="main-content">
<a class="back-link" href="settlement-list.html">← 返回列表</a>
<div class="page-header">
<h2 id="pgTitle">结算单详情</h2>
<p id="pgSub"></p>
</div>
<div class="info-grid">
<div class="info-card"><div class="info-label">当月分成基数（不含税）</div><div class="info-value" id="vBase">-</div></div>
<div class="info-card"><div class="info-label">分成金额</div><div class="info-value" style="color: var(--klein);" id="vAmount">-</div></div>
<div class="info-card"><div class="info-label">确认状态</div><div class="info-value" id="vConfirm">-</div></div>
<div class="info-card"><div class="info-label">提现状态</div><div class="info-value" id="vWd">-</div></div>
</div>
<div class="content-card">
<div class="content-card-header"><h3 class="content-card-title">阶梯分段计算</h3><span style="font-size:12px;color:var(--text-muted);" id="vTierNote"></span></div>
<div class="table-wrapper">
<table class="table">
<thead><tr><th>计算段</th><th>本月基数分段</th><th>年度累计（分段后）</th><th>比例</th><th>分成</th></tr></thead>
<tbody id="tierBody"></tbody>
</table>
</div>
</div>
<div class="content-card">
<h3 style="font-size:15px;font-weight:600;margin-bottom:var(--spacing-md);">单据信息</h3>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--spacing-md);font-size:14px;" id="metaGrid"></div>
</div>
<div style="display:flex;gap:var(--spacing-md);" id="opBar"></div>
</main>
<div id="toast"></div>
<script>
function showToast(msg, icon){
  var t = document.getElementById('toast');
  t.textContent = (icon || '\u2713') + ' ' + msg;
  t.style.display = 'block';
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.style.display = 'none'; }, 2400);
}
var DATA = {
  'CST20260601': { period: '2026年6月', base: '¥19,000.00', amount: '¥4,610.00', confirm: '待我确认', wd: '—',
    tierNote: '按年度累计档位对当月基数分段计费（超额累进），本月跨越 3 万元档位',
    tiers: [['累计 ≤3万 部分','¥2,800.00','¥27,200 → ¥30,000','20%','¥560.00'],['累计 3万-10万 部分','¥16,200.00','¥30,000 → ¥46,200','25%','¥4,050.00'],['合计','¥19,000.00','年度累计 ¥46,200','—','¥4,610.00']],
    meta: [['生成时间','2026-07-01 09:00（每月1日跑批）'],['运营确认','2026-07-01 15:00 已确认'],['我方确认','待确认（5个工作日内，逾期并入下月）'],['关联提现单','—']], canConfirm: true },
  'CST20260501': { period: '2026年5月', base: '¥12,600.00', amount: '¥2,520.00', confirm: '已确认', wd: '提现中',
    tierNote: '年度累计 ¥27,200 未超 3 万元，整月按 20% 计算',
    tiers: [['累计 ≤3万 部分','¥12,600.00','¥14,600 → ¥27,200','20%','¥2,520.00'],['合计','¥12,600.00','年度累计 ¥27,200','—','¥2,520.00']],
    meta: [['生成时间','2026-06-01 09:00'],['运营确认','2026-06-02 10:00 已确认'],['我方确认','2026-06-03 09:30 已确认'],['关联提现单','CWD20260715001（待开票，待上传发票）；曾发起 CWD20260605003 已撤回、发票作废']] },
  'CST20260401': { period: '2026年4月', base: '¥8,400.00', amount: '¥1,680.00', confirm: '已确认', wd: '提现中',
    tierNote: '年度累计 ¥14,600 未超 3 万元，整月按 20% 计算',
    tiers: [['累计 ≤3万 部分','¥8,400.00','¥6,200 → ¥14,600','20%','¥1,680.00'],['合计','¥8,400.00','年度累计 ¥14,600','—','¥1,680.00']],
    meta: [['生成时间','2026-05-01 09:00'],['运营确认','2026-05-05 已确认'],['我方确认','2026-05-06 已确认'],['关联提现单','CWD20260610001（待审核）']] },
  'CST20260301': { period: '2026年3月', base: '¥6,200.00', amount: '¥1,240.00', confirm: '已确认', wd: '已提现',
    tierNote: '年度累计 ¥6,200 未超 3 万元，整月按 20% 计算',
    tiers: [['累计 ≤3万 部分','¥6,200.00','¥0 → ¥6,200','20%','¥1,240.00'],['合计','¥6,200.00','年度累计 ¥6,200','—','¥1,240.00']],
    meta: [['生成时间','2026-04-01 09:00'],['运营确认','2026-04-02 已确认'],['我方确认','2026-04-03 已确认'],['关联提现单','CWD20260415001（已付款 2026-04-18）']] }
};
var id = new URLSearchParams(location.search).get('id') || 'CST20260601';
var d = DATA[id] || DATA['CST20260601'];
document.getElementById('pgTitle').textContent = '结算单详情 · ' + id;
document.getElementById('pgSub').textContent = '结算周期：' + d.period + ' · 客户推荐模式阶梯分成';
document.getElementById('vBase').textContent = d.base;
document.getElementById('vAmount').textContent = d.amount;
document.getElementById('vConfirm').textContent = d.confirm;
document.getElementById('vWd').textContent = d.wd;
document.getElementById('vTierNote').textContent = d.tierNote;
document.getElementById('tierBody').innerHTML = d.tiers.map(function(t, i){
  var last = i === d.tiers.length - 1;
  return '<tr>' + t.map(function(c){ return '<td>' + (last ? '<strong>' + c + '</strong>' : c) + '</td>'; }).join('') + '</tr>';
}).join('');
document.getElementById('metaGrid').innerHTML = d.meta.map(function(m){
  return '<div><div style="font-size:12px;color:var(--text-muted);">' + m[0] + '</div><div style="margin-top:2px;">' + m[1] + '</div></div>';
}).join('');
var op = document.getElementById('opBar');
if (d.canConfirm) op.innerHTML = '<button class="btn btn-primary" type="button" onclick="doConfirm()">确认结算单</button>';
else if (d.canWithdraw) op.innerHTML = '<a class="btn btn-primary" href="withdrawal-apply.html">发起提现</a>';
function doConfirm(){
  document.getElementById('vConfirm').textContent = '已确认';
  document.getElementById('opBar').innerHTML = '<a class="btn btn-primary" href="withdrawal-apply.html">发起提现</a>';
  showToast('结算单已确认，' + d.amount + ' 已计入可提现金额');
}
</script>
</body>
</html>
